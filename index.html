  if(d.t==='usda') return d.id?`USDA SR28 ${ndb(d.id)}${d.n?` · ${d.n}`:''}${e.aiq?' · matched from the AI’s description':''}`:d.ids?`USDA SR28 ${d.ids.map(([i,g])=>`${ndb(i)} × ${g} g`).join(', ')}`:'USDA SR28';
  if(d.t==='recipe') return d.ids?`Built from USDA SR28 ingredients: ${d.ids.map(([i,g])=>`${ndb(i)} × ${g} g`).join(', ')}`:'Your recipe, from its ingredients.';
  if(d.t==='label') return d.by?`Printed label: ${d.by}`:'Read from the printed nutrition label.';
  if(d.t==='table') return d.by||'National food composition table.';
  if(d.t==='off') return `Open Food Facts${d.b?` · ${d.b}`:''}${d.uae?' · made in the UAE':''}${d.code?`, barcode ${d.code}`:''} (the package label).`;
  if(d.t==='fdc') return `USDA FoodData Central #${d.id} · ${d.dt==='b'?'brand label'+(d.b?`: ${d.b}`:''):d.dt==='s'?'FNDDS survey dish':'Foundation food'}${e.aiq?' · matched from the AI’s description':''}`;
  if(d.t==='chain') return `${d.src||d.c}${d.d?` · checked ${d.d}`:''}. The restaurant’s own published numbers; your portion can differ a little.`;
  if(d.t==='you') return 'Entered by you.';
  if(d.t==='meal') return 'Your saved meal: each part keeps its own source.';
  return 'AI guess: not from a database. Tap Change match to pick a USDA food.'}
/* AI identifies; databases supply the numbers */
const FUEL_NAMES=()=>[...new Set(FOODS.map(f=>f.name))].join('; ');
const ID_SPEC=()=>`Reply with JSON only, no prose: {"items":[{"name":"short food name","grams":0,"fuel":"","usda":"","kcal":0,"p":0,"c":0,"f":0}],"note":"one short sentence on key assumptions"}.
One item per distinct food or drink. grams = estimated amount eaten in grams (ml for drinks). Use typical UAE home and restaurant portions when amounts aren't stated.
fuel = the exact name from this list when the item is one of these foods or dishes, else "": ${FUEL_NAMES()}.
usda = when fuel is "", a description in USDA SR28 naming style for the item as eaten, e.g. "Chicken, broilers or fryers, thigh, meat only, cooked, roasted" or "Rice, white, long-grain, regular, enriched, cooked".
kcal, p, c, f = your own estimate for the whole item, used only if no database match is found.
List cooking oil, butter, ghee, sauces, dressings and spreads as their own items.`;
const guessOf=x=>({kcal:Math.max(0,r0(x.kcal)),p:Math.max(0,r1(x.p)),c:Math.max(0,r1(x.c)),f:Math.max(0,r1(x.f))});
function aiGuessItem(x){const g=Math.max(1,r0(+x.grams||0)); return {name:String(x.name||'Food').slice(0,60),serving:`${g} g`,sz:g,un:'g',qty:1,...guessOf(x),src:'ai',ds:{t:'ai'},aiq:{name:String(x.name||''),usda:String(x.usda||''),g,guess:guessOf(x)}}}
function fromFood(fd,g,aiq){return {...fd,qty:fd.sz?Math.max(0.1,Math.round(g/fd.sz*20)/20):1,...(fd.sz?{mode:'g'}:{}),src:'ai',aiq}}
function fromUsda(f,g,aiq){return {...usdaItem(f,100,'100 g'),name:aiq.name||f[1],qty:Math.max(0.01,g/100),mode:'g',src:'ai',aiq}}
function matchItem(x){
  const g0=+x.grams>0?r0(+x.grams):0, aiq={name:String(x.name||'Food').slice(0,60),usda:String(x.usda||''),g:g0,guess:guessOf(x)};
  const fd=FOODS.find(f=>f.name.toLowerCase()===String(x.fuel||'').trim().toLowerCase())||FOODS.find(f=>f.name.toLowerCase()===aiq.name.toLowerCase());
  if(fd){aiq.g=g0||fd.sz||100; return fromFood(fd,aiq.g,aiq)}
  const m=USDA&&usdaRank(aiq.usda||aiq.name,1,false)[0]; if(m){aiq.g=g0||(m[4][0]?m[4][0][1]:100); return fromUsda(m,aiq.g,aiq)}
  return aiGuessItem({...x,grams:g0||100});
}
async function idItems(v){const arr=Array.isArray(v&&v.items)?v.items:[]; try{await loadUSDA()}catch(e){}
  const out=arr.filter(x=>x&&(+x.grams>0||+x.kcal>0)).map(matchItem);
  /* still an AI guess: ask the online databases before falling back to the AI's numbers */
  await Promise.all(out.map(async(it,i)=>{if(dsOf(it).t!=='ai') return; const m=await liveMatch(it.aiq.usda&&it.aiq.name.split(' ').length<2?it.aiq.usda:it.aiq.name).catch(()=>null);
    if(m){const g=it.aiq.g||m.sz; out[i]={...m,name:it.aiq.name||m.name,qty:Math.max(0.01,g/m.sz),mode:'g',src:'ai',aiq:it.aiq}}}));
  return out}
function matchChoices(i){const q=i.aiq||{name:i.name}, words=qTerms(q.name);
  const fuel=FOODS.filter(f=>{const n=f.name.toLowerCase(); return words.some(w=>w.length>2&&n.includes(w))}).slice(0,4);
  const us=USDA?usdaRank(q.usda||q.name,6,false):[]; return {fuel,us}}
/* daily vitamins and minerals vs US Dietary Reference Intakes, men 19–30 */
const DRI={fb:[38,'g','Fiber'],k:[3400,'mg','Potassium'],ca:[1000,'mg','Calcium'],mg:[400,'mg','Magnesium'],fe:[8,'mg','Iron'],zn:[11,'mg','Zinc'],vd:[15,'µg','Vitamin D'],vc:[90,'mg','Vitamin C'],
  va:[900,'µg','Vitamin A'],b12:[2.4,'µg','Vitamin B12'],fol:[400,'µg','Folate'],ve:[15,'mg','Vitamin E'],vk:[120,'µg','Vitamin K'],b6:[1.3,'mg','Vitamin B6'],b1:[1.2,'mg','Thiamin (B1)'],b2:[1.3,'mg','Riboflavin (B2)'],
  b3:[16,'mg','Niacin (B3)'],cho:[550,'mg','Choline'],ph:[700,'mg','Phosphorus'],se:[55,'µg','Selenium'],cu:[0.9,'mg','Copper'],mn:[2.3,'mg','Manganese']};
const DRI_TOP=['fb','k','ca','mg','fe','zn','vd','vc','va','b12','fol'];
function microTotals(entries){
  const t={}, have={}; let n=0, full=0;
  entries.forEach(e=>{const q=+e.qty||0, m=e.mi||{}; n++; if(Object.keys(m).length>=10) full++;
    MI_KEYS.forEach(k=>{if(m[k]!=null){t[k]=(t[k]||0)+m[k]*q; have[k]=(have[k]||0)+1}});
    ['fb','na'].forEach(k=>{if(e[k]!=null){t[k]=(t[k]||0)+e[k]*q; have[k]=(have[k]||0)+1}})});
  return {t,have,n,full};
}
const fmtMi=(v,u)=>u==='g'?r1(v)+' g':v>=100?fmt(Math.round(v))+' '+u:(Math.round(v*10)/10)+' '+u;
function nutRow(k,v,goal,u,name,limit){
  const pc=goal?v/goal*100:0, cls=limit?(pc>100?'over':''):(pc>=100?'met':pc<50?'low':'');
  return `<div class="nrow ${cls}"><span>${name}</span><div class="ntrack"><i style="width:${Math.min(100,pc).toFixed(1)}%"></i></div><b>${limit?fmtMi(v,u):Math.round(pc)+'%'}</b></div>`;
}
function nutrientsCard(day,P){
  const m=microTotals(day.entries); if(!m.n||!day.entries.some(e=>e.mi&&Object.keys(e.mi).length)) return '';
  const satMax=Math.round((+P.kcal||2200)*0.1/9);
  const top=DRI_TOP.map(k=>nutRow(k,m.t[k]||0,DRI[k][0],DRI[k][1],DRI[k][2])).join('');
  const rest=Object.keys(DRI).filter(k=>!DRI_TOP.includes(k)).map(k=>nutRow(k,m.t[k]||0,DRI[k][0],DRI[k][1],DRI[k][2])).join('');
  const lim=nutRow('na',m.t.na||0,2300,'mg','Sodium · limit 2,300 mg',true)+nutRow('sat',m.t.sat||0,satMax,'g',`Saturated fat · limit ${satMax} g`,true);
  const miss=m.n-m.full;
  return `<div class="gap"></div><h2 class="sec">Vitamins &amp; Minerals</h2><section class="card nutr">${top}
    <details class="nmore"><summary>All nutrients</summary>${rest}</details>${lim}
    <p class="nfoot">${miss?`${m.n-miss} of ${m.n} foods have full vitamin data. ${miss===1?'One food':miss+' foods'} (You, Label or AI guess) may be missing some, so real totals can be higher.`:`All ${m.n} foods have full vitamin data.`} Targets: US Dietary Reference Intakes, men 19–30.</p></section>`;
}
function entryNutrients(e){
  const q=+e.qty||0, m=e.mi||{}, keys=Object.keys(DRI).filter(k=>(k==='fb'?e.fb:m[k])!=null);
  if(!keys.length) return `<p class="nfoot" style="margin:0">No vitamin or mineral data for this food.</p>`;
  return keys.map(k=>{const v=(k==='fb'?+e.fb:+m[k])*q; return `<div class="nrow"><span>${DRI[k][2]}</span><b>${fmtMi(v,DRI[k][1])}</b><em>${Math.round(v/DRI[k][0]*100)}%</em></div>`}).join('');
}

/* ---------- council features: day status, repeating foods, multi-select, what fits, times, calendar, check-in ---------- */
const TICK_S='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
/* entry time, only when it was logged on that same day (logging yesterday's dinner today shouldn't show today's clock) */
const hhmm=t=>{const d=new Date(+t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const clock=(t,date)=>{t=+t; if(!(t>1e12)||ymd(new Date(t))!==(date||S.date)) return ''; return hhmm(t)};

/* Day status: "All logged" days feed the check-in; "Missed some" days never do. Tapping the chosen one again clears it. */
function dayStatus(day,isToday,slam){
  const st=day.st&&day.st.s;
  return `<div class="gap"></div><section class="card dst">${st==='done'?stampHTML('All logged','sd',slam):''}<p class="dst-q">${isToday?'Finished logging today?':'Was this day fully logged?'}</p>
    <div class="dst-b"><button class="dsb${st==='done'?' on':''}" data-act="dayst" data-v="done" aria-pressed="${st==='done'}">${st==='done'?TICK_S:''}All logged</button><button class="dsb part${st==='partial'?' on':''}" data-act="dayst" data-v="partial" aria-pressed="${st==='partial'}">Missed some</button></div>
    <p class="nfoot">Only fully logged days count toward your weekly check-in.</p></section>`;
}
async function setDayStatus(date,s){const d=await getDay(date), cur=d.st&&d.st.s; d.st={s:cur===s?'':s,u:Date.now()}; saveDay(d); haptic('confirm'); if(currentView()==='progress') renderProgress(); else renderToday()}
function yesterdayPrompt(){
  const y=addDays(TODAY(),-1), d=S.days[y]||(S.hist&&S.hist[y]); if(!d||!d.entries.length||(d.st&&d.st.s)) return '';
  return `<section class="card yq"><p>Did you log everything yesterday? <span>${fmt(totals(d).kcal)} kcal</span></p><div class="dst-b"><button class="dsb" data-act="dayst" data-v="done" data-d="${y}">Yes, all of it</button><button class="dsb part" data-act="dayst" data-v="partial" data-d="${y}">Missed some</button></div></section><div class="gap" style="height:12px"></div>`;
}

/* Repeating foods: shown greyed in their meal each day; one tap logs, ✕ hides for today. Never logged without a tap.
   The logged entry's id is fixed per repeat and day, so two devices can't log it twice. */
function ghostsFor(day){
  if(day.date!==TODAY()) return []; const dow=(parseYmd(day.date).getDay()+6)%7, have=new Set(day.entries.map(e=>e.rep&&e.rep+'|'+day.date)), skip=new Set(day.rskip||[]);
  return S.plan.repeats.filter(r=>r&&r.food&&(!r.days||r.days.includes(dow))&&!have.has(r.id+'|'+day.date)&&!skip.has(r.id));
}
function ghostRow(r){const f=r.food, q=+f.qty||1;
  return `<li class="ghost"><div class="row gh"><span class="t">${esc(f.name)}</span><span class="d">Every day · ${esc(qtyLabel(f))}</span><span class="k">${fmt(f.kcal*q)}</span><span class="gh-b"><button class="gh-ok" data-act="repOk" data-v="${esc(r.id)}" aria-label="Log ${esc(f.name)}">${TICK_S}</button><button class="gh-x" data-act="repNo" data-v="${esc(r.id)}" aria-label="Not today"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div></li>`}
async function repConfirm(rid){
  const r=S.plan.repeats.find(x=>x.id===rid); if(!r) return; const d=await getDay(TODAY());
  if(d.entries.some(e=>e.rep===rid)) return; let id=`rep-${rid}-${d.date}`; if((d.del||[]).includes(id)) id+='-'+uid();
  const now=Date.now(); d.entries.push({...r.food,id,meal:r.meal,t:now,u:now,rep:rid}); saveDay(d); haptic('confirm'); pendingDrop=dropsFor([r.food]); renderToday(); toast(`Logged ${r.food.name}`);
}
async function repSkip(rid){const d=await getDay(TODAY()); d.rskip=[...new Set([...(d.rskip||[]),rid])]; saveDay(d); renderToday()}
const repeatOf=e=>S.plan.repeats.find(r=>r&&r.food&&foodKey(r.food)===foodKey(e)&&r.meal===e.meal);
async function toggleRepeat(){
  const day=await getDay(S.date), e=day.entries.find(x=>x.id===editing.id); if(!e) return; const ex=repeatOf(e);
  if(ex){S.plan.repeats=S.plan.repeats.filter(r=>r!==ex); S.plan.del=uniqDel(S.plan.del,[ex.id]); toast('Won’t suggest it every day')}
  else{S.plan.repeats=[...S.plan.repeats,{id:'r'+uid(),food:{name:e.name,serving:e.serving,qty:+e.qty,kcal:e.kcal,p:e.p,c:e.c,f:e.f,...keepX(e)},meal:e.meal,days:[0,1,2,3,4,5,6],u:Date.now()}];
    toast(`${e.name} will wait in ${mealName(e.meal)} each day`)}
  save('plan',S.plan); haptic(); eRerender();
}
function delRepeat(id){S.plan.repeats=S.plan.repeats.filter(r=>r.id!==id); S.plan.del=uniqDel(S.plan.del,[id]); save('plan',S.plan); renderSettings()}

/* Multi-select: long-press a food to start, tap to add more. Copy, save as a meal, or delete together. */
let selIds=null, lpT=null, lpX=0, lpY=0, lpFired=false;
document.addEventListener('pointerdown',e=>{
  const row=e.target.closest&&e.target.closest('#v-today button.row[data-act="entry"]'); lpFired=false; if(!row||selIds||sheetOpen()) return;
  lpX=e.clientX; lpY=e.clientY; clearTimeout(lpT);
  lpT=setTimeout(()=>{lpT=null; if(sw&&sw.on) return; sw=null; lpFired=true; selIds=new Set([row.dataset.v]); haptic('confirm'); renderToday()},480);
},{passive:true});
document.addEventListener('pointermove',e=>{if(lpT&&(Math.abs(e.clientX-lpX)>8||Math.abs(e.clientY-lpY)>8)){clearTimeout(lpT); lpT=null}},{passive:true});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT); lpT=null; if(lpFired){lpFired=false; swallow=true; setTimeout(()=>{swallow=false},350)}},{passive:true}));
function renderSelBar(){
  let bar=$('#selBar'); const on=selIds&&currentView()==='today';
  $('#addBtn').classList.toggle('away',!!on); $('#snapBtn').classList.toggle('away',!!on); if(!on){if(bar) bar.hidden=true; return}
  if(!bar){bar=document.createElement('div'); bar.id='selBar'; bar.className='selbar'; document.body.appendChild(bar)}
  const past=S.date<TODAY(), n=selIds.size; bar.hidden=false;
  bar.innerHTML=`<div class="sb-h"><b>${n} selected</b><button class="txtbtn" data-act="selDone">Done</button></div>
    <div class="sb-b"><button data-act="selCopy" data-v="${past?TODAY():addDays(S.date,1)}">Copy to ${past?'Today':'Tomorrow'}</button><button data-act="selMeal">Save as Meal</button><button class="danger" data-act="selDel">Delete</button></div>`;
}
const selEntries=async()=>{const d=await getDay(S.date); return d.entries.filter(e=>selIds&&selIds.has(e.id))};
async function selCopy(to){const es=await selEntries(); if(!es.length) return; const d=await getDay(to), now=Date.now();
  d.entries.push(...es.map((e,i)=>{const x={...e,id:uid(),t:now+i,u:now+i}; delete x.rep; return x})); saveDay(d); selIds=null; haptic('confirm'); renderToday(); toast(`Copied ${es.length} to ${dayTitle(to)}`)}
function selAsMeal(){gSheet('Save as Meal',`<div class="field"><label for="selMealName">Name</label><input type="text" id="selMealName" placeholder="e.g. My usual breakfast" autocapitalize="sentences" enterkeyhint="done"></div><p class="foot" style="margin:0 4px">Each food keeps its own source and numbers.</p>`,`<button class="txtbtn r" data-act="selMealSave">Save</button>`); setTimeout(()=>{const i=$('#selMealName'); i&&i.focus()},80)}
async function selMealSave(){const name=(($('#selMealName')||{}).value||'').trim(); if(!name){$('#selMealName').focus(); return}
  const es=await selEntries(); if(!es.length) return; const items=es.map(i=>({name:i.name,serving:i.serving,qty:+i.qty,kcal:+i.kcal,p:+i.p,c:+i.c,f:+i.f,src:i.src||'db',...keepX(i)}));
  const tot=items.reduce((a,i)=>{a.k+=i.kcal*i.qty;a.p+=i.p*i.qty;a.c+=i.c*i.qty;a.f+=i.f*i.qty;return a},{k:0,p:0,c:0,f:0});
  const meal={ds:{t:'meal'},name,serving:`meal · ${items.length} items`,kcal:r0(tot.k),p:r1(tot.p),c:r1(tot.c),f:r1(tot.f),items};
  undel(S.foods,'cus:'+foodKey(meal)); S.foods.custom=[meal,...S.foods.custom.filter(x=>foodKey(x)!==foodKey(meal))]; save('foods',S.foods);

async function selDelete(){const d=await getDay(S.date), ids=new Set(selIds||[]), gone=d.entries.filter(e=>ids.has(e.id)); if(!gone.length) return;
  d.entries=d.entries.filter(e=>!ids.has(e.id)); d.del=uniqDel(d.del,[...ids]); saveDay(d); selIds=null; renderToday();
  toastUndo(`Deleted ${gone.length} food${gone.length===1?'':'s'}`,async()=>{const x=await getDay(S.date); gone.forEach(e=>{const id=uid(); x.entries.push({...e,id,u:Date.now()})}); saveDay(x); renderToday()})}

/* What fits: from your own favourites, meals, recents and repeating foods. No AI, no cost. */
let fitI=0;
function fitsList(left,pLeft){
  if(left<120) return []; const seen=new Set();
  const pool=[...S.foods.favs,...S.foods.custom,...S.foods.recents,...S.plan.repeats.map(r=>r.food)].filter(f=>{if(!f||!(f.kcal>0)) return false; const k=foodKey(f); if(seen.has(k)) return false; seen.add(k); return true});
  return pool.map(f=>{const q=Array.isArray(f.items)?1:(+f.qty||1), k=f.kcal*q, p=f.p*q; if(k>left+40||k<Math.min(120,left*0.25)) return null;
    return {f,q,k,p,s:(pLeft>5?Math.min(p,pLeft)/pLeft:0)*0.65+(k/left)*0.35}}).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,6);
}
function fitsLine(left,pLeft){
  const L=fitsList(left,pLeft); if(!L.length) return ''; const n=fitI%L.length, x=L[n];
  return `<section class="card fits" aria-label="Fits what’s left"><div class="fi-t"><span class="fi-k">Fits what’s left</span><b>${esc(x.f.name)}</b><small>${fmt(x.k)} kcal · ${r0(x.p)} g protein</small></div>
    ${L.length>1?`<button class="fi-n" data-act="fitNext" aria-label="Show another option">Next</button>`:''}<button class="fi-add" data-act="fitAdd" data-v="${n}" aria-label="Log ${esc(x.f.name)}">+</button></section><div class="gap" style="height:12px"></div>`;
}
async function fitAdd(n){
  const day=await getDay(TODAY()), P=S.profile, t=totals(day), L=fitsList(P.kcal-t.kcal,P.p-t.p), x=L[n]; if(!x) return;
  const meal=autoMeal(), now=Date.now(), parts=Array.isArray(x.f.items)?x.f.items:[{...x.f,qty:x.q}];
  const added=parts.map((i,k)=>({name:i.name,serving:i.serving,qty:+i.qty||1,kcal:+i.kcal,p:+i.p,c:+i.c,f:+i.f,...keepX(i),meal,src:i.src||'db',id:uid(),t:now+k,u:now+k}));
  day.entries.push(...added); saveDay(day); haptic('confirm'); fitI=0; pendingDrop=dropsFor(added); await renderToday();
  const ids=new Set(added.map(e=>e.id)); toastUndo(`Added ${x.f.name}`,async()=>{const d=await getDay(TODAY()); d.entries=d.entries.filter(e=>!ids.has(e.id)); d.del=uniqDel(d.del,[...ids]); saveDay(d); renderToday()});
}

/* Calendar of logged days */
let calM=null;
function calendarCard(){
  const T=TODAY(), base=calM||T.slice(0,7), y=+base.slice(0,4), m=+base.slice(5,7)-1, first=new Date(y,m,1), n=new Date(y,m+1,0).getDate(), lead=(first.getDay()+6)%7, h={...(S.hist||{}),...S.days};
  let cells=''; for(let i=0;i<lead;i++) cells+='<span></span>';
  for(let d=1;d<=n;d++){const ds=ymd(new Date(y,m,d)), day=h[ds], logged=day&&day.entries.length, st=day&&day.st&&day.st.s;
    if(ds>T){cells+=`<span class="cd fut">${d}</span>`; continue}
    const cls=!logged?'none':st==='done'?'done':st==='partial'?'part':'logged';
    cells+=`<button class="cd ${cls}${ds===T?' now':''}" data-act="calDay" data-v="${ds}" aria-label="${shortDate(ds)}: ${!logged?'nothing logged':cls==='done'?'all logged':cls==='part'?'missed some':'logged, not marked'}">${d}</button>`}
  return `<div class="gap"></div><h2 class="sec">Log Calendar</h2><section class="card calc"><div class="cal-h"><button class="circ" data-act="calPrev" aria-label="Previous month">${ICON_L}</button><b>${DF(first,{month:'long',year:'numeric'})}</b><button class="circ" data-act="calNext" aria-label="Next month"${base>=T.slice(0,7)?' disabled':''}>${ICON_R}</button></div>
    <div class="cal-w">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-g">${cells}</div>
    <div class="legend"><span><i class="lg done"></i>All logged</span><span><i class="lg part"></i>Missed some</span><span><i class="lg logged"></i>Not marked</span></div></section>

function amtAct(b){

/* ---------- WHOOP: recovery, sleep, strain and workouts ----------
   Two ways in, one store. WHOOP's own data export (the zip or its CSVs) works on any device. The optional live
   connector is a small server the person deploys once: the Claude version calls it as a claude.ai connector, the
   GitHub version fetches it directly. Days are keyed by the morning you woke up, because that's the day a WHOOP
   recovery belongs to. Fields: r recovery %, hrv ms, rhr bpm, st day strain, kc kcal burned, sl asleep min,
   bed in-bed min, sp sleep performance %, sn sleep need min. */
const normWhoop=w=>({kind:'whoop',days:{},wk:{},meta:{},del:[],...(w||{})});
function mergeWhoop(a,b){
  a=normWhoop(a); if(!b) return a; b=normWhoop(b); const del=uniqDel(a.del,b.del), ds=new Set(del), days={...b.days};
  for(const [d,v] of Object.entries(a.days)){const o=days[d]; days[d]=!o?v:(+v.u||0)>=(+o.u||0)?{...o,...v}:{...v,...o}}
  const wk={}; [...Object.entries(b.wk),...Object.entries(a.wk)].forEach(([id,w])=>{if(ds.has(id)) return; const o=wk[id]; if(!o||(+w.u||0)>=(+o.u||0)) wk[id]=w});

}
const WH_F=[['r','recovery'],['hrv','hrv'],['rhr','rhr'],['st','strain'],['kc','kcal'],['sl','sleep_min'],['bed','in_bed_min'],['sp','sleep_perf'],['sn','sleep_need_min']];
const whoopHas=()=>!!(S.whoop&&(Object.keys(S.whoop.days).length||Object.keys(S.whoop.wk).length));
const whoopDay=d=>(S.whoop&&S.whoop.days[d])||null;
const recZone=r=>r==null?'':r>=67?'g':r>=34?'y':'r';
const ZONE={g:['Green','var(--green)'],y:['Yellow','var(--c-f)'],r:['Red','var(--red)']};
const hm=min=>{if(min==null) return '–'; const m=Math.round(min); return `${Math.floor(m/60)}:${pad(m%60)}`};
/* Everything from an import or a sync lands here; WHOOP's numbers win over a day you typed in yourself. */
function whoopIngest(data,src){
  const W=S.whoop, now=Date.now(), dates=[]; let nd=0,nw=0;
  (data.days||[]).forEach(x=>{if(!x||!/^\d{4}-\d\d-\d\d$/.test(x.date)) return; const v={};
    WH_F.forEach(([k,f])=>{const n=x[f]==null||x[f]===''?NaN:+x[f]; if(isFinite(n)) v[k]=Math.round(n*10)/10});
    if(!Object.keys(v).length) return; W.days[x.date]={...(W.days[x.date]||{}),...v,src,u:now}; nd++; dates.push(x.date)});
  (data.workouts||[]).forEach(x=>{if(!x||!/^\d{4}-\d\d-\d\d$/.test(x.date)||!x.sport) return; const id='wh-'+x.date+'-'+String(x.start||'').replace(':','');
    if(W.del.includes(id)) return; W.wk[id]={d:x.date,n:String(x.sport).slice(0,40),min:Math.round(+x.min||0),kc:Math.round(+x.kcal||0),st:Math.round((+x.strain||0)*10)/10,u:now}; nw++; dates.push(x.date)});
  const keep=addDays(TODAY(),-730); for(const d of Object.keys(W.days)) if(d<keep) delete W.days[d]; for(const [id,w] of Object.entries(W.wk)) if(w.d<keep) delete W.wk[id];

/* WHOOP sport names to Fuel's sports. Strength sessions are skipped: Fuel's own gym log covers those. */
const WH_STRENGTH=/weight|power ?lift|strength|bodybuild|crossfit|functional/i;

const whoopSport=n=>{const m=WH_MAP.find(([re])=>re.test(n||'')); return m?m[1]:''};

}

/* ---- import: the zip WHOOP emails, or the CSVs inside it ---- */
async function unzipCSVs(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf); let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--) if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0) throw new Error('zip');

  for(let k=0;k<n&&p+46<=u8.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), size=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl)); p+=46+nl+xl+cl;
    if(!/\.csv$/i.test(name)||/(^|\/)(__MACOSX|\.)/.test(name)) continue;
    const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true), raw=u8.subarray(st,st+size);
    let text=null;
    if(method===0) text=new TextDecoder().decode(raw);
    else if(method===8){if(typeof DecompressionStream==='undefined') throw new Error('nodeflate'); text=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}
    if(text!=null) out[name.split('/').pop().toLowerCase()]=text;
  }
  return out;
}
function parseCSV(t){
  t=String(t).replace(/^﻿/,''); const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"'; i++} else q=false} else f+=c}
    else if(c==='"') q=true; else if(c===','){row.push(f); f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f); rows.push(row)} return rows;
}
const csvTab=t=>{const r=parseCSV(t), h=(r[0]||[]).map(s=>s.trim()); return {rows:r.slice(1),col:(...res)=>{for(const re of res){const i=h.findIndex(x=>re.test(x)); if(i>=0) return i} return -1}}};
const csvNum=v=>{const s=String(v==null?'':v).trim().replace(/%$/,''); if(!s) return null; const n=+s; return isFinite(n)?n:null};
const csvTime=v=>{const m=String(v||'').match(/(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/); return m?{d:`${m[1]}-${m[2]}-${m[3]}`,hm:`${m[4]}:${m[5]}`,t:Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5])}:null};
const yes=v=>/^(true|yes|1)$/i.test(String(v||'').trim());
function whoopFromCSV(files){
  const days={}, workouts=[], find=re=>Object.entries(files).find(([n])=>re.test(n));
  const put=(d,k,v,soft)=>{if(v==null) return; const o=days[d]||(days[d]={date:d}); if(soft&&o[k]!=null) return; o[k]=v};
  /* a cycle belongs to the morning you woke up; without a wake time, the start (usually bedtime) plus 8 hours */
  const dayOf=(wake,start)=>{const w=csvTime(wake); if(w) return w.d; const s=csvTime(start); return s?new Date(s.t+8*36e5).toISOString().slice(0,10):null};
  const sleepCols=T=>[['sleep_min',T.col(/^asleep duration/i)],['in_bed_min',T.col(/^in bed duration/i)],['sleep_perf',T.col(/^sleep performance/i)],['sleep_need_min',T.col(/^sleep need/i)]];
  const cyc=find(/physiological|cycle/);
  if(cyc){const T=csvTab(cyc[1]), iS=T.col(/^cycle start/i), iW=T.col(/^wake onset/i);
    const cols=[['recovery',T.col(/^recovery score/i)],['hrv',T.col(/^heart rate variability/i)],['rhr',T.col(/^resting heart rate/i)],['strain',T.col(/^day strain/i)],['kcal',T.col(/^energy burned/i)],...sleepCols(T)];
    T.rows.forEach(r=>{const d=dayOf(r[iW],r[iS]); if(d) cols.forEach(([k,i])=>{if(i>=0) put(d,k,csvNum(r[i]))})})}
  const sl=find(/sleep/);
  if(sl){const T=csvTab(sl[1]), iS=T.col(/^sleep onset/i,/^cycle start/i), iW=T.col(/^wake onset/i), iN=T.col(/^nap$/i), cols=sleepCols(T);
    T.rows.forEach(r=>{if(iN>=0&&yes(r[iN])) return; const d=dayOf(r[iW],r[iS]); if(d) cols.forEach(([k,i])=>{if(i>=0) put(d,k,csvNum(r[i]),true)})})}
  const wo=find(/workout/);
  if(wo){const T=csvTab(wo[1]), iS=T.col(/^workout start/i), iE=T.col(/^workout end/i), iD=T.col(/^duration/i), iN=T.col(/^activity name/i,/^sport/i), iSt=T.col(/^activity strain/i,/strain/i), iK=T.col(/^energy burned/i);
    T.rows.forEach(r=>{const s=csvTime(r[iS]); if(!s||iN<0||!r[iN]) return; const e=csvTime(r[iE]); let min=csvNum(r[iD]); if(min==null&&e) min=(e.t-s.t)/6e4;
      workouts.push({date:s.d,start:s.hm,sport:r[iN].trim(),min:min||0,strain:iSt>=0?csvNum(r[iSt]):null,kcal:iK>=0?csvNum(r[iK]):null})})}

}
async function whoopImport(list){

  const z=recZone(rec);
  /* sleep vs what you ate that day: only full logged days, never today */
  let insight=''; const H=S.hist||{}, short=[], long=[];
  for(let i=1;i<=90;i++){const d=addDays(T,-i), s=get(d,'sl'), day=S.days[d]||H[d]; if(s==null||!day||!day.entries.length) continue; const k=totals(day).kcal; if(s<390) short.push(k); else if(s>=420) long.push(k)}
  if(short.length>=5&&long.length>=5){const m=a=>a.reduce((x,y)=>x+y,0)/a.length, diff=Math.round((m(short)-m(long))/10)*10;

      :`After nights under 6½ hours you ate <b>${fmt(Math.abs(diff))} kcal ${diff>0?'more':'less'}</b> on average than after 7 hours or more (${short.length} vs ${long.length} days).`}
  const dh=hrv!=null&&hrv0!=null?Math.round(hrv-hrv0):null;

      <div class="stat"><span>HRV</span><b>${hrv==null?'–':r0(hrv)}</b><small>${dh==null?'ms':`ms · ${dh>0?'+':dh<0?'−':''}${Math.abs(dh)} vs month`}</small></div></div>

      <p class="bk-t" style="margin-top:12px">Sleep, last 4 weeks</p>${whBars(rows('sl'),{max:600,guide:need||480,label:'Hours asleep by day',color:()=>'var(--wat)',tip:v=>`${hm(v)} asleep`})}
    </section>
    <p class="foot">${insight?insight+' ':''}The line on sleep is your ${need?'average sleep need from WHOOP':'8-hour mark'}.</p>`;
}

const whoopKey=()=>{try{return localStorage.getItem('fuel-whoopkey')||''}catch(e){return ''}};

let mcpNS=null; const whSync={busy:false,err:'',code:''};
const WH_SERVER='WHOOP', WH_TOOL='whoop_history';
async function whoopSync(manual){
  if(whSync.busy) return; const P=S.profile; if(!P.whoopLive&&!manual) return;
  const last=(S.whoop.meta||{}).sync||0; if(!manual&&Date.now()-last<20*6e4) return;
  const days=last?Math.max(3,Math.min(90,Math.ceil((Date.now()-last)/864e5)+2)):90;
  whSync.busy=true; whSync.err=''; whSync.code=''; whRefresh();
  try{
    let data;
    if(STANDALONE){
      const b=whoopBase(), k=whoopKey(); if(!b||!k) throw {code:'setup'};
      const res=await fetch(`${b}/api/history?days=${days}`,{headers:{Authorization:'Bearer '+k}});
      if(res.status===401) throw {code:'key'}; const j=await res.json().catch(()=>null);
      if(!res.ok) throw {code:j&&j.code||'server',message:j&&j.error}; data=j;
    } else {
      if(!mcpNS) throw {code:'no_mcp'};
      const r=await mcpNS.callTool(WH_SERVER,WH_TOOL,{days},{cache:false}); data=r.payload;
      if(typeof data==='string') data=JSON.parse(data);
    }
    if(!data||!Array.isArray(data.days)) throw {code:'server'};
    whoopIngest(data,'api'); if(manual&&!P.whoopLive){P.whoopLive=1; save('profile',P)}
  }catch(e){whSync.code=e&&e.code||'server'; whSync.err=whoopErr(e)}
  whSync.busy=false; whRefresh(); if(manual) toast(whSync.err||'WHOOP updated');
}
function whoopErr(e){

    :c==='needs_reauth'?'Reconnect WHOOP in Claude: Customize → Connectors.'
    :c==='selection_required'?'Claude has two connectors called WHOOP. Pick one when Claude asks, or rename one.'
    :c==='not_in_manifest'||c==='approval_required'||c==='consent_required'?'Fuel needs your OK to use WHOOP. Tap Update Now and allow it.'
    :c==='no_mcp'?'Live sync works in the Claude app or claude.ai. Use the export import here.'
    :c==='setup'?'Add your server link and key first.'
    :c==='key'?'The server didn’t accept that key. Check it matches ACCESS_KEY.'

    :c==='server_unavailable'||c==='upstream_error'?'WHOOP or your server didn’t answer. Try again in a minute.'

async function saveFile(name,data,type){
  try{const file=new File([data],name,{type}); if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name}); return true}}catch(e){if(e&&e.name==='AbortError') return true}
  try{const u=URL.createObjectURL(new Blob([data],{type})), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); return true}catch(e){return false}
}

async function restoreJSON(file){

  if(!b||b.app!=='fuel'||typeof b.days!=='object'){toast('That file isn’t a Fuel backup.');return false}
  let n=0;
  for(const [d,bd] of Object.entries(b.days)){ if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!bd||!Array.isArray(bd.entries)) continue; const cur=await getDay(d); saveDay(mergeDay(cur,{...emptyDay(d),...bd,date:d,kind:'day'})); n++ }
  if(b.foods){S.foods=mergeFoods(S.foods,b.foods); save('foods',S.foods)}
  if(b.plan&&typeof b.plan==='object'){S.plan=mergePlan(S.plan,b.plan); save('plan',S.plan)}
  if(b.weights){S.weights=mergeWeights(S.weights,b.weights); save('weights',S.weights)}
  if(b.lifts){S.lifts=mergeLifts(S.lifts,b.lifts); save('lifts',S.lifts)}
  if(b.whoop&&typeof b.whoop==='object'){S.whoop=mergeWhoop(S.whoop,b.whoop); save('whoop',S.whoop)}
  if(b.money&&Array.isArray(b.money.months)){for(const m of b.money.months){if(!m||!/^\d{4}-\d{2}$/.test(m.ym)||!Array.isArray(m.list)) continue; saveMonth(mergeMonth(await getMonth(m.ym),{...emptyMonth(m.ym),...m,kind:'money'}))} if(b.money.cfg){S.mcfg=mergeCfg(S.mcfg,b.money.cfg); save('mcfg',S.mcfg)}}
  if(b.routines&&Array.isArray(b.routines.list)){S.routines=b.routines; save('routines',S.routines)}
  if(Array.isArray(b.workouts)) for(const w of b.workouts){if(w&&w.id&&w.kind==='workout'){const m=mergeWorkout(S.wk[w.id],w); S.wk[w.id]=m; save('wk-'+w.id,m)}}
  if(b.profile&&+b.profile.kcal>0){S.profile={...S.profile,...b.profile,ver:PROFILE_VER,setup:1}; save('profile',S.profile)}
  S.hist=null; renderSettings(); toast(`Restored ${n} day${n===1?'':'s'}`); return true;
}

  else if(motionOK()) t.animate([{transform:'translate(-50%,0) scale(.97)',opacity:.7},{transform:'translate(-50%,0) scale(1)',opacity:1}],{duration:180,easing:EASE.out});
  toastLeft=dur; toastTick()}

/* A bank text or the Shortcut's clipboard line → {kind:'spend'|'in'|'otp', amt, cur, name, card}. The first amount in the

function parseBankText(txt){

  if(/\b(otp|one[- ]time (password|pin|code)|verification code|activation code|do not share)\b/i.test(s)) return {kind:'otp'};

}

function moneyChart(ym,st,pst,upto,anim){

    case 'mon': {const n=ymAdd(mView||ymOf(Date.now()),+v); if(n>ymOf(Date.now())) break; mView=n; mAll=false; mFresh=true; haptic(); await renderMoney(); window.scrollTo(0,0)} break;
    case 'now': mView=ymOf(Date.now()); mAll=false; mFresh=true; renderMoney(); break;
    case 'go': if(v&&v!==mView){mView=v; mAll=false; mFresh=true; haptic(); await renderMoney(); window.scrollTo(0,0)} break;
    case 'all': mAll=true; renderMoney(); break;
    case 'cat': showCatSpends(v); break;
    case 'paySetup': showPaySetup(); break;
    case 'payCopy': if(!await copyText(payLink(),'Link copied')) toast('Copy didn’t work here. Press and hold the link to copy it.'); break;
    case 'payTest': closeSheet('#gSheet'); setTimeout(()=>payIntake({amt:mCur()+' 1.00',m:'Test Shop',c:'',t:'test-'+Date.now()}),300); break;
    case 'csv': exportMoneyCSV(); break;
  }
});
/* ---------- design-engineering pass 2 ---------- */
/* Tab bar: a copy of the tabs in the active colour, clipped to the indicator, so a label turns white exactly where the pill is (Emil's clip-path tabs). */
const tbOn=(()=>{const w=$('.tabbar .wrap'); if(!w) return null; const o=document.createElement('div'); o.className='tb-on'; o.setAttribute('aria-hidden','true');
  w.querySelectorAll(':scope>a').forEach(a=>{const c=a.cloneNode(true); c.removeAttribute('href'); c.removeAttribute('aria-current'); c.removeAttribute('data-route'); c.tabIndex=-1; o.appendChild(c)}); w.appendChild(o); $('.tabbar').classList.add('tb-glide'); return o})();
function tbClip(i,instant){if(!tbOn||i<0) return; const W2=tbOn.offsetWidth; if(!W2){requestAnimationFrame(()=>tbClip(i,true)); return} const w=(W2-12)/VIEWS.length, L=6+i*w, R=W2-L-w;
  if(instant) tbOn.style.transition='none'; tbOn.style.clipPath=`inset(6px ${R.toFixed(1)}px 6px ${L.toFixed(1)}px round 24px)`; if(instant){void tbOn.offsetWidth; tbOn.style.transition=''}}
addEventListener('resize',()=>tbClip(VIEWS.indexOf(currentView()),true));

/* Segmented controls: a thumb slides to the chosen segment. Controls re-rendered by innerHTML start the thumb where it was,
   using the last chosen index per control (container id + aria-label). */
const segLast=new Map();
function segFit(sg){const bs=[...sg.querySelectorAll(':scope>button')], i=bs.findIndex(b=>b.getAttribute('aria-pressed')==='true'); let th=sg.querySelector(':scope>.seg-th');
  if(i<0||!sg.offsetWidth){if(th) th.style.opacity='0'; return}
  const fresh=!th; if(fresh){const cs=getComputedStyle(bs[i]); th=document.createElement('i'); th.className='seg-th'; th.setAttribute('aria-hidden','true'); th.style.background=cs.backgroundColor; th.style.borderRadius=cs.borderRadius; sg.prepend(th); sg.classList.add('gl')}
  const h=sg.closest('[id]'), k=(h?h.id:'')+'|'+(sg.getAttribute('aria-label')||''), prev=segLast.get(k), b=bs[i];
  if(fresh&&prev!=null&&prev!==i&&bs[prev]&&motionOK()){th.style.transition='none'; th.style.width=bs[prev].offsetWidth+'px'; th.style.transform=`translateX(${bs[prev].offsetLeft}px)`; void th.offsetWidth; th.style.transition=''}
  th.style.width=b.offsetWidth+'px'; th.style.height=b.offsetHeight+'px'; th.style.top=b.offsetTop+'px'; th.style.transform=`translateX(${b.offsetLeft}px)`; th.style.opacity='1'; segLast.set(k,i)}
/* runs before paint (microtask), so a re-rendered control never shows its old highlight for a frame */
const segMO=new MutationObserver(ms=>{const set=new Set(); for(const m of ms){const t=m.target;
  if(m.type==='attributes'){if(m.attributeName==='hidden'){if(t.querySelectorAll) t.querySelectorAll('.seg').forEach(x=>set.add(x))} else {const sg=t.closest&&t.closest('.seg'); if(sg) set.add(sg)}}
  else m.addedNodes.forEach(n=>{if(n.nodeType!==1) return; if(n.matches('.seg')) set.add(n); else if(n.firstElementChild) n.querySelectorAll('.seg').forEach(x=>set.add(x)); const up=n.closest&&n.closest('.seg'); if(up) set.add(up)})}
  set.forEach(segFit)});
segMO.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['aria-pressed','hidden']});
addEventListener('resize',()=>$$('.seg').forEach(segFit)); requestAnimationFrame(()=>$$('.seg').forEach(segFit));

/* Hold to confirm: destructive buttons fill while pressed (1.2 s, linear) and act at the end; letting go early snaps back fast. */
const HOLD={discard:()=>discardWorkout()};
let hold=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-hold]'); if(!b||e.button>0||hold) return;
  hold={b,id:e.pointerId,t:setTimeout(()=>{const h=hold; hold=null; h.b.classList.remove('holding'); haptic('confirm'); (HOLD[h.b.dataset.hold]||(()=>{}))()},1200)}; b.classList.add('holding'); haptic()});
const holdEnd=e=>{if(!hold||e.pointerId!==hold.id) return; clearTimeout(hold.t); const b=hold.b; hold=null; b.classList.remove('holding'); if(e.type==='pointerup') toast('Keep holding to '+(b.dataset.holdTip||'confirm'))};
document.addEventListener('pointerup',holdEnd); document.addEventListener('pointercancel',holdEnd);
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-hold]'); if(b&&e.detail===0) (HOLD[b.dataset.hold]||(()=>{}))()});   // keyboard

/* Water: tap anywhere on the row or drag across it; the level follows the finger and is saved on release. */
let wsc=null;
document.addEventListener('pointerdown',e=>{const row=e.target.closest&&e.target.closest('#waterCard .cups'); if(!row||e.button>0||wsc) return;
  const cups=[...row.querySelectorAll('.cup')]; if(!cups.length) return; e.preventDefault();
  const at=x=>{let k=0,d=1e9; cups.forEach((c,j)=>{const r=c.getBoundingClientRect(), m=Math.abs(r.left+r.width/2-x); if(m<d){d=m; k=j}}); return k};
  const i=at(e.clientX); wsc={row,cups,at,id:e.pointerId,i0:i,i,moved:false}; try{row.setPointerCapture(e.pointerId)}catch(x){} row.classList.add('scrub')});
document.addEventListener('pointermove',e=>{if(!wsc||e.pointerId!==wsc.id) return; const i=wsc.at(e.clientX); if(i===wsc.i) return; wsc.i=i; wsc.moved=true; haptic();
  wsc.cups.forEach((c,j)=>{const f=c.querySelector('i'); if(f) f.style.transform=`scaleY(${j<=i?1:0})`}); const v=$('#waterCard .v'); if(v){const g=v.textContent.split('/')[1]; v.textContent=`${((i+1)*0.25).toLocaleString('en-GB',{maximumFractionDigits:2})} /${g}`}});
const wscEnd=e=>{if(!wsc||e.pointerId!==wsc.id) return; const t=wsc; wsc=null; t.row.classList.remove('scrub'); swpEat=Date.now(); if(e.type!=='pointerup') return;
  const c=t.cups[t.i]; if(!t.moved){c.click&&addWater(+c.dataset.v); return} getDay(S.date).then(day=>{const ml=(day.water&&+day.water.ml)||0; addWater((t.i+1)*250-ml)})};
document.addEventListener('pointerup',wscEnd); document.addEventListener('pointercancel',wscEnd);


(async()=>{await storageReady(); (LS.get('dirty')||[]).forEach(k=>dirty.add(k)); const fresh=!LS.get('profile');
  loadLocal(); if(!fresh&&!S.profile.setup){S.profile.setup=1; LS.set('profile',S.profile)}
  autoCloseStale(); route(); if(S.active) openWorkout(); connect(); payBoot();
  if(fresh&&STANDALONE) openSetup(false)})();
</script>
