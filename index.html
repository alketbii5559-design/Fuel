.btn,.btn:not(.tint):not(.ghost),#v-train .btn{background:var(--btn);color:var(--btn-ink);box-shadow:none;border-radius:14px;font:600 16px var(--font);letter-spacing:-.01em;transition:transform .18s var(--e-out),opacity .15s}
.btn:not(.tint):not(.ghost):active,.btn:active{transform:scale(.97);box-shadow:none}
.btn.tint{background:var(--fill);color:var(--label)}
.btn.ghost{background:var(--fill);color:var(--label)}
.start-card .btn.big,.start-card.live .btn.big{background:var(--btn);color:var(--btn-ink);font:600 17px var(--font);box-shadow:none}
#trayGo{background:var(--pro);color:#0d1406;box-shadow:none;font:600 16px var(--font)}
.addbtn{background:var(--label);color:#0b0b0e;font:600 16px var(--font);letter-spacing:-.01em;border-radius:99px;padding:14px 24px;box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.addbtn:active{transform:translateX(-50%) scale(.96);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.addbtn svg{width:18px;height:18px}
.tabbar a[aria-current="page"],.tabbar a[data-route="train"][aria-current="page"]{color:var(--label)}
.tabbar a{color:var(--label3)}
.wk-finish{background:var(--pro);color:#0d1406;font-weight:600;border-radius:99px}
/* add sheet */
.tile{background:var(--cell);font:600 15px var(--font);letter-spacing:-.01em;min-height:100px;transition:transform .18s var(--e-out)}
.tile:active{transform:scale(.97)}
.tile .ic{color:var(--label)}
.circ{background:var(--fill);color:var(--label)}.circ:disabled{color:var(--label3)}.tile .ic svg{width:24px;height:24px;stroke-width:1.7}
.tile small{font-weight:450;font-size:13px}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--label)}
.seg{background:var(--fill);border-radius:10px}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#3a3a44;color:var(--label)}
.exact .grid4 input{font:600 20px var(--font);letter-spacing:-.02em;background:var(--cell);box-shadow:inset 0 0 0 1px var(--hair)}
.field label{font-size:13px}
.ds{font:500 11px/1.6 var(--mono);letter-spacing:0;background:transparent;box-shadow:inset 0 0 0 1px var(--hair);color:var(--label2)}
.ds-usda,.ds-fdc,.ds-recipe,.ds-table,.ds-label,.ds-off{color:var(--label2)}
.ds-ai{color:#16130a;background:var(--yel);box-shadow:none}
/* Today */
.dl-sub .streak-t{font:500 13px var(--font);background:none;color:var(--label2);box-shadow:inset 0 0 0 1px var(--hair);border-radius:99px;padding:4px 10px;transform:none}
.dl-sub .streak-t::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pro);margin-right:8px;vertical-align:1px}
#v-today .row .k{font:600 16px var(--font);letter-spacing:-.01em}
.tk-glass{border-radius:28px;background:#101014;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -24px 40px rgba(0,0,0,.45)}
.tk-tank.over .tk-glass{box-shadow:inset 0 0 0 1.5px var(--red),inset 0 -24px 40px rgba(0,0,0,.45)}
.tk-b{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28)}
.tk-b.c,.tk-b.f{box-shadow:inset 0 1px 0 rgba(0,0,0,.18)}
.tk-w{top:-7px;height:9px}
.tk-sheen{left:10px;width:5px;background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.02));border-radius:4px}
.tk-tk{right:10px;width:10px;height:1.5px;background:rgba(255,255,255,.22)}.tk-tk.l{width:16px}
.tk-k{font:500 13px var(--font);color:var(--label2)}.tk-k em{font:500 13px var(--font)}
.odo{font:600 54px/1 var(--num);letter-spacing:-.045em;margin:12px 0 6px}
.od{max-width:.64em;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}.odm{max-width:.26em;margin:0 -.03em}
.odo{height:1.12em;line-height:1.12;margin:8px 0 4px}.od,.odm{height:1.12em}.odr i{height:1.12em}
.tk-s{font:500 13px var(--font);color:var(--label2)}
.tk-r p{font:500 13px var(--font)}
.tk-r p span::before{width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:0}
.tk-r b{font:600 15px var(--font);letter-spacing:-.01em}.tk-r b small{font:500 12px var(--font);letter-spacing:0}
.tk-bar{height:5px;border-radius:4px}.tk-bar i{border-radius:4px}
.tk-ball{width:14px;height:14px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35)}
.tk-rip{border-width:1.5px;border-color:rgba(255,255,255,.7)}
.stamp{--rot:0deg;display:inline-flex;align-items:center;gap:4px;font:600 12px var(--font);letter-spacing:0;color:var(--yel);border:1px solid color-mix(in srgb,var(--yel) 55%,transparent);background:color-mix(in srgb,var(--yel) 10%,var(--bg));border-radius:99px;padding:4px 10px 4px 8px;transform:none}
.stamp::after{display:none}
.stamp.sp{right:0;top:-20px}.stamp.sd{--rot:0deg;right:14px;top:-13px}.stamp.pr{--rot:0deg;right:64px;top:-12px}
@keyframes stampIn{0%{transform:scale(1.35);opacity:0;filter:blur(3px)}60%{transform:scale(.97);opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
#v-today li.slap{animation:slapIn 380ms var(--e-out) 260ms both}
@keyframes slapIn{0%{transform:translateY(-6px) scale(1.02);opacity:0}100%{transform:none;opacity:1}}
.dl-tile b.big,.dl-tile.water b.v,.dl-pair .dl-tile b,.dl-weigh b{font:600 22px/1.15 var(--font);letter-spacing:-.03em}
.dl-weigh b{font-size:22px}
.dl-day>b{font:600 11px var(--font)}.dl-day small{font:500 11px var(--mono)}
.dl-day.ok u.on{background:var(--label)}.dl-day.now u.on{background:var(--pro)}.dl-day.now>b{color:var(--pro)}
.wd-col u{width:7px;height:7px}
.dl-tile.water .cup{border-radius:4px 4px 8px 8px}
.dl-tile.train .plates i{border-radius:4px;width:10px}
.ci-k{color:var(--label2)}.fi-k{color:var(--pro)}
.yq{box-shadow:inset 0 0 0 1px var(--hair)!important;border:0}
#v-today .card.ci{border:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--trn) 45%,transparent)}
.dsb{font:600 15px var(--font)}.dsb.on{background:var(--pro);color:#0d1406}.dsb.part.on{background:var(--yel);color:#16130a}
.fi-add{background:var(--pro);color:#0d1406;font:500 22px/1 var(--font)}
/* train */
.wk-exname{font:600 17px/1.25 var(--font)!important;letter-spacing:-.02em}
.wk-set{font:600 15px var(--font)}
.stp-v{font:600 20px/1 var(--font);letter-spacing:-.02em}
.wk-check,.wk-check[aria-pressed="true"],.wk-row.pr .wk-check[aria-pressed="true"]{box-shadow:none}
.wk-check:active{transform:scale(.92)!important}
.wk-check[aria-pressed="true"]{background:var(--pro);color:#0d1406}
.wk-row.cur{background:color-mix(in srgb,var(--trn) 12%,transparent)}
.wk-row.cur .wk-set{background:var(--trn);color:#0b0b0e}
.wk-row.done{background:color-mix(in srgb,var(--pro) 7%,transparent)}
.restbar{background:rgba(24,24,30,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 0 0 1px var(--hair),0 16px 40px rgba(0,0,0,.6)}
.rb-t{font:600 28px/1 var(--font);letter-spacing:-.04em}
.rb-dots u{background:var(--label)}
.rb-btns button{font:500 15px var(--font)}
.sc-k{text-transform:none;letter-spacing:0;font:500 13px var(--font)}
.start-card h2{font:700 34px/1.05 var(--display);letter-spacing:-.035em}
.blk i{border-radius:2px}
.sum-hero h3{font:700 28px/1.1 var(--font);letter-spacing:-.03em}.sum-grid b{font:600 17px var(--font)}
.sum-medal,.sum-medal.pr{background:var(--pro);color:#0d1406}
/* progress */
.stat b{font:600 28px/1.05 var(--font);letter-spacing:-.04em}
.chart text{font-family:var(--mono)!important;font-size:11px}
.cd{font:500 13px var(--font);border-radius:50%}
.cd.done,.cd.done:nth-child(3n),.cd.done:nth-child(5n){transform:none;background:color-mix(in srgb,var(--pro) 18%,transparent);color:var(--pro);box-shadow:inset 0 0 0 1.5px var(--pro);font-weight:600}
.cd.part{color:var(--yel);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--yel) 70%,transparent)}
.cd.now{outline:1.5px solid var(--label);outline-offset:2px}
i.lg.done{background:color-mix(in srgb,var(--pro) 18%,transparent);box-shadow:inset 0 0 0 1.5px var(--pro)}i.lg.part{box-shadow:inset 0 0 0 1.5px var(--yel)}
#v-train,#wk{--cell:#15151a;--btn:#f3f3f5;--btn-ink:#0b0b0e;--blue:#eceae4;--link:#f3f3f5}
.wk-top{background:rgba(11,11,14,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* review pass: actions are neutral, colour is data */
:root[data-theme="dark"]{--link:#e9e9ee}
#v-train,#wk{--link:#e9e9ee}
.txtbtn,.row.action .t,.rlink{color:var(--label)}
.sheet-bar .txtbtn{color:var(--label2)}.sheet-bar .txtbtn.r{color:var(--label);font-weight:600}
.sc-k,.start-card .sc-k,.start-card.live .sc-k{color:var(--label2)}
#v-today .card.ci{box-shadow:inset 0 0 0 1px var(--hair)}
.ci-k{color:var(--label2)}
.pace{background:none;padding:0;font:500 13px var(--font);display:inline-flex;align-items:center;gap:6px}
.pace i{width:6px;height:6px;border-radius:50%;display:inline-block}
/* workout: quiet set numbers, neutral hint, light Finish */
.wk-why{color:var(--label2);font-size:13px}
.wk-set{background:none;color:var(--label2);font:500 15px var(--mono)}
.wk-row.cur .wk-set{background:none;color:var(--label);box-shadow:inset 0 0 0 1.5px var(--label)}
.wk-row.cur{background:color-mix(in srgb,var(--label) 5%,transparent)}
.wk-finish{background:var(--label);color:#0b0b0e}
.stp{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.wk-row.cur .stp{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.wk-check{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.wk-check[aria-pressed="true"]{box-shadow:none}
.wk-progress i{background:var(--label)}
/* Today: water and training read as instruments, not toys */
.dl-tile.water .cups{grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:12px}
.dl-tile.water .cup{height:22px;border-radius:4px}
.dl-tile.train .plates{gap:4px}.dl-tile.train .plates i{width:22px;height:6px;border-radius:4px}
.yq{padding:12px 14px;gap:8px}.yq p{font-size:15px;font-weight:500}.yq .dsb{min-height:38px;font-size:13px}
.tile{min-height:88px;padding:12px 6px;gap:4px}
.nmore summary{color:var(--label)}
.row input[type=number]{color:var(--label);font:500 16px var(--font)}.row input[type=number]:focus{color:var(--pro)}
.row input[type=number]::placeholder{color:var(--label3)}
.wk-link{color:var(--label)}.wk-add{color:var(--label)}
#wk .wk-top .circ,#wk .wk-top button:not(.wk-finish){color:var(--label)}
/* section titles a step quieter */
.sec,#v-train .sec{font:600 17px/1.2 var(--display);letter-spacing:-.015em}
/* settings */
input[switch]{accent-color:var(--pro)}
.row .t{letter-spacing:-.01em}

/* ---------- MotionSites pass (29 Oct) ----------
   The free techniques behind MotionSites' prompts (React Bits: glass dock, blur-in text, staggered lists, count-up),
   translated into Fuel's rules: transform/opacity only, user-caused, short, never on every app open. */
.tabbar{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));padding:0;border-radius:30px;max-width:520px;margin:0 auto;
  background:rgba(20,20,26,.84);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.06),0 14px 40px rgba(0,0,0,.55)}
.tabbar .wrap{position:relative;height:60px;padding:6px;box-sizing:border-box}
.tb-ind{position:absolute;left:6px;top:6px;bottom:6px;width:calc((100% - 12px)/5);border-radius:24px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform 480ms cubic-bezier(.32,1.25,.5,1);will-change:transform}
.tabbar a{position:relative;z-index:1;font-size:11px;font-weight:600;gap:4px;transition:color .2s}
.tabbar a svg{width:22px;height:22px}
.tabbar a[aria-current="page"] svg{animation:none}
body{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.addbtn{bottom:calc(84px + env(safe-area-inset-bottom))}
.selbar{bottom:calc(84px + env(safe-area-inset-bottom))}
/* tab switch: content slides in from the side you moved toward, coming into focus */
.view.enter>*{animation:viewIn 340ms var(--e-out) both}
.view.enter>*:nth-child(2){animation-delay:25ms}.view.enter>*:nth-child(3){animation-delay:50ms}.view.enter>*:nth-child(4){animation-delay:75ms}
.view.enter>*:nth-child(5){animation-delay:100ms}.view.enter>*:nth-child(6){animation-delay:125ms}.view.enter>*:nth-child(n+7){animation-delay:150ms}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dx,0));filter:blur(4px)}}
/* large title collapses into the bar */
.titlebar .large{transform-origin:left center;will-change:transform,opacity}
.navbar .small{opacity:0;transition:none!important}
body.scrolled .navbar{background:rgba(11,11,14,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 .5px 0 var(--hair)}
/* Add sheet: options rise in, one after another */
.sheet.open .tiles>*{animation:riseIn 360ms var(--e-out) both}
.sheet.open .tiles>*:nth-child(2){animation-delay:40ms}.sheet.open .tiles>*:nth-child(3){animation-delay:80ms}
.sheet.open .search{animation:riseIn 360ms var(--e-out) 110ms both}
@keyframes riseIn{from{opacity:0;transform:translateY(10px) scale(.98);filter:blur(3px)}}
/* Progress: headline numbers roll up */
.sroll{display:flex;align-items:baseline;gap:4px}
.odo.sm{font:inherit;font-size:28px;font-weight:600;letter-spacing:-.04em;margin:2px 0;height:1.12em}
.stat .sroll span,.stat .sroll i{font-size:inherit;color:inherit;font-weight:inherit;margin:0;display:block}
.stat .sroll .od{max-width:.64em}.stat .sroll .od.z,.stat .sroll .odm.z{max-width:0}.stat .sroll .odm{max-width:.26em}
.stat .sroll .su{font:600 22px var(--font);letter-spacing:-.03em;color:var(--label);align-self:flex-end;margin-bottom:.12em}
@media (prefers-reduced-motion:reduce){.tb-ind{transition:none}.view.enter>*,.sheet.open .tiles>*,.sheet.open .search{animation:none}}

/* ---------- Setup (first run, and again from Settings) ---------- */
body.in-setup{overflow:hidden}body.in-setup .tabbar,body.in-setup .addbtn{display:none}
.setup{position:fixed;inset:0;z-index:95;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.su-wrap{max-width:520px;min-height:100%;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;box-sizing:border-box}
.su-top{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;height:48px}
.su-nav{border:0;background:none;color:var(--label);width:44px;height:44px;display:grid;place-items:center;padding:0;font:500 16px var(--font)}.su-nav.txt{width:auto;justify-self:end;color:var(--label2)}
.su-prog{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}.su-prog i{display:block;height:100%;background:var(--label);border-radius:2px;transform-origin:left;transition:transform .45s var(--e-out)}
.su-body{flex:1;padding:16px 0 24px;display:flex;flex-direction:column;gap:16px;animation:suIn .34s var(--e-out) both}
@keyframes suIn{from{opacity:0;transform:translateX(var(--dx,0));filter:blur(3px)}}
.su-body h1{margin:0;font:700 28px/1.08 var(--display);letter-spacing:-.035em}
.su-lead{margin:-6px 0 4px;color:var(--label2);font-size:15px;line-height:1.45}.su-lead b{color:var(--label);font-weight:600}
.su-hero{display:grid;gap:14px;padding-top:12vh}.su-hero h1{font-size:44px}.su-hero p{margin:0;color:var(--label2);font-size:17px;line-height:1.45}
.su-mark{display:flex;gap:6px;align-items:flex-end;height:44px}.su-mark span{width:16px;border-radius:4px;background:var(--pro);height:60%}.su-mark span:nth-child(2){background:var(--c-c);height:80%}.su-mark span:nth-child(3){background:var(--c-f);height:100%}
.su-list p{margin:0;color:var(--label2);font-size:15px;line-height:1.45}.su-list b{color:var(--label);font-weight:600}
.su-f{display:grid;gap:8px}.su-f>span:first-child{font:500 13px var(--font);color:var(--label2)}
.su-in{display:flex;align-items:center;background:var(--cell);border-radius:14px;box-shadow:inset 0 0 0 1px var(--hair);padding:0 14px;min-height:52px}
.su-in input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--label);font:500 17px var(--font);padding:0;height:50px}
.su-in em{font-style:normal;color:var(--label2);font-size:15px;margin-left:6px}
.su-f textarea{width:100%;box-sizing:border-box;border:0;border-radius:14px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--hair);color:var(--label);font:16px/1.4 var(--font);padding:12px 14px;min-height:88px;outline:none;resize:vertical}
.su-in:focus-within,.su-f textarea:focus{box-shadow:inset 0 0 0 1.5px var(--label)}
.su-f.bad .su-in,.su-big.bad{box-shadow:inset 0 0 0 1.5px var(--red)}.su-f.bad .su-seg{box-shadow:0 0 0 1.5px var(--red)}
.su-err{margin:0;color:var(--red);font-size:15px;font-weight:500}
.su-hint{color:var(--label3);font-size:13px;line-height:1.4}
.su-row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.su-row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.su-row3>*,.su-row2>*{min-width:0}.su-row3 .su-in,.su-row2 .su-in{padding:0 12px}.su-in input{width:100%}
.su-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--cell);border-radius:14px;padding:4px;box-shadow:inset 0 0 0 1px var(--hair)}
.su-seg button{border:0;border-radius:10px;min-height:44px;background:none;color:var(--label2);font:600 16px var(--font);transition:background .2s,color .2s}
.su-seg button[aria-pressed="true"]{background:var(--label);color:#0b0b0e}
.su-opts{display:grid;gap:8px}

:root{--e-out:cubic-bezier(.23,1,.32,1);--e-io:cubic-bezier(.77,0,.175,1);--e-drawer:cubic-bezier(.32,.72,0,1)}
/* presses: one feel everywhere */
.btn,.chip2,.circ,.cup,.mini,.tile,.dl-tile,.dl-weigh,.dl-day,.wk-set,.wk-add,.wk-addset,.wk-unit,.wk-tb,.exthumb,.su-chip,.mm-arr,.seg button,.dsb,.fi-add{transition:transform 160ms var(--e-out),background-color .15s ease,color .15s ease,box-shadow 160ms var(--e-out)}
.btn:active,.chip2:active,.circ:active,.cup:active,.mini:active,.tile:active,.dl-tile:active,.dl-weigh:active,.dl-day:active,.wk-set:active,.wk-add:active,.wk-addset:active,.wk-unit:active,.wk-tb:active,.exthumb:active,.su-chip:active,.mm-arr:active,.seg button:active,.dsb:active,.fi-add:active{transform:scale(.97);transition-duration:90ms}
.addbtn{transition:transform 160ms var(--e-out),box-shadow 160ms var(--e-out)}.addbtn:active{transition-duration:90ms}
.wk-check{transition:transform 160ms var(--e-out),background-color .15s ease,color .15s ease}.wk-check:active{transition-duration:90ms}
/* tabs are switched dozens of times a day: quick, no overshoot, no blur */
.tb-ind{transition:transform 260ms var(--e-out)}
.tabbar a svg{transition:transform 200ms var(--e-out)}
.tabbar a[aria-current="page"] svg{animation:tabPop 200ms var(--e-out)}
@keyframes tabPop{from{transform:scale(.9)}}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dx,0))}}
.view.enter>*{animation:viewIn 220ms var(--e-out) both}
.view.enter>*:nth-child(2){animation-delay:20ms}.view.enter>*:nth-child(3){animation-delay:40ms}.view.enter>*:nth-child(4){animation-delay:60ms}
.view.enter>*:nth-child(5),.view.enter>*:nth-child(6),.view.enter>*:nth-child(n+7){animation-delay:80ms}
/* Add sheet opens many times a day */
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}}
.sheet.open .tiles>*{animation:riseIn 240ms var(--e-out) both}
.sheet.open .tiles>*:nth-child(2){animation-delay:30ms}.sheet.open .tiles>*:nth-child(3){animation-delay:60ms}
.sheet.open .search{animation:riseIn 240ms var(--e-out) 60ms both}
/* sheets: the backdrop fades by opacity (no full-screen repaint), the page behind moves in step with the panel, and closing is quicker than opening */
.sheet,.sheet.open{background:transparent}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity 450ms var(--e-drawer)}
.sheet.open>.sh-bg{opacity:1}
.panel{position:relative;z-index:1}
.sheet:not(.open) .panel,.sheet:not(.open)>.sh-bg{transition-duration:280ms}
main.wrap,.navbar{transition:transform 450ms var(--e-drawer),border-radius 450ms var(--e-drawer)}
body.stacked main.wrap{filter:none}
body:not(.stacked) main.wrap,body:not(.stacked) .navbar{transition-duration:280ms}
/* toast: comes in from its edge, leaves the same way (faster), can be flicked away, interruptible */
.toast{animation:none;opacity:0;transform:translate(-50%,calc(-100% - 20px));transition:transform 340ms var(--e-out),opacity 240ms var(--e-out);touch-action:none;will-change:transform;user-select:none;-webkit-user-select:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast:not(.on){transition-duration:200ms,160ms}
body.in-wk .toast{transform:translate(-50%,calc(100% + 20px))}
body.in-wk .toast.on{transform:translate(-50%,0)}
/* reduced motion: fewer and gentler, not none: fades stay, movement goes */
@media (prefers-reduced-motion:reduce){
  .panel,.sheet.open .panel{transform:none;opacity:0;transition:opacity 200ms ease}.sheet.open .panel{opacity:1}
  .toast,body.in-wk .toast,.toast.on,body.in-wk .toast.on{transform:translate(-50%,0);transition:opacity 180ms ease}
  .btn:active,.chip2:active,.circ:active,.tile:active,.addbtn:active{transform:none}
  .tb-ind,.tabbar a svg,main.wrap,.navbar{transition:none}
}
/* ---------- design-engineering pass 2: components and unseen details ---------- */
/* tab bar: labels change colour exactly under the moving pill (a clipped copy of the tabs in the active colour) */
.tb-on{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;box-sizing:border-box;pointer-events:none;z-index:2;transition:clip-path 260ms var(--e-out)}
.tabbar .tb-on a{color:var(--label)}
.tabbar.tb-glide a[aria-current="page"]{color:var(--label3)}
.tabbar a[aria-current="page"] svg,.tabbar .tb-on svg{animation:none}
/* segmented controls: a sliding thumb (iOS) */
.seg{position:relative}
.seg>button{transition:transform 160ms var(--e-out)}
.seg.gl>button{position:relative;z-index:1;background:transparent!important;box-shadow:none!important}
.seg-th{position:absolute;left:0;top:2px;z-index:0;pointer-events:none;transition:transform 240ms var(--e-out),width 240ms var(--e-out),opacity .15s}
/* hold to confirm (destructive): fills while held, linear and deliberate; snaps back fast on release */
.hold{position:relative;overflow:hidden;isolation:isolate}
.hold::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,107,107,.24);clip-path:inset(0 100% 0 0);transition:clip-path 200ms var(--e-out)}
.hold.holding::before{clip-path:inset(0 0 0 0);transition:clip-path 1.2s linear}
.hold.holding{transform:scale(.97)}
/* tooltips scale from the point they describe */
.tip{transform-origin:50% 100%}
/* water: the whole row is the control (tap or drag across it), with a taller touch area */
.dl-tile.water .cups{position:relative;touch-action:none}
.dl-tile.water .cups::before{content:"";position:absolute;inset:-12px -4px}
.dl-tile.water .cups.scrub .cup i{transition:transform 120ms var(--e-out)!important}
/* hit areas: at least ~44 pt without changing the look */
.circ,.wk-tb,.wk-set,.wk-unit,.chip2,.mm-arr,.seg>button{position:relative}
.circ::before,.wk-tb::before,.wk-set::before,.wk-unit::before,.mm-arr::before{content:"";position:absolute;inset:-6px}
.chip2::before{content:"";position:absolute;inset:-5px -2px}
.seg>button::before{content:"";position:absolute;inset:-6px -1px}
/* type details */
h1,h2,h3,.sc-k{text-wrap:balance}
p,.foot{text-wrap:pretty}
.num,.cd,.stats b,.dl-tile .v,.mm-nav span,#v-progress b,.wk-prev,.wk-in{font-variant-numeric:tabular-nums}
:where(button,a,summary,label[for],[role="button"]):focus-visible{outline:2px solid var(--link);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.tb-on,.seg-th{transition:none}.hold.holding::before{transition:clip-path .01s linear 1.2s}}
/* ---------- unslop-ui audit (31 Oct) ----------
   Decisions (owner-picked from rendered options, 31 Oct): Gauge type = Barlow Semi Condensed for titles and numbers
   (road-sign / instrument-cluster grotesk, because Fuel is a gauge) + Atkinson Hyperlegible Next for UI and Mono for data
   (built to be read at a glance, mid-set). Training data colour = Chalk #eceae4 (gym chalk); no purple left in the app.
   Scales: type = Apple Dynamic Type sizes (11 12 13 15 16 17 20 22 28 34) + 44/54 for hero numbers; spacing = 2/4 grid
   (2 4 6 8 10 12 14 16 20 24 32); radius by role = 2 hairline, 4 block, 6 tag, 8 inner, 10 control, 14 button, 20 card,
   full for pills/circles (tank glass 28 is its own shape).
   Fixes: violet had leaked onto controls (reads as default AI purple, and breaks Fuel's own "actions stay neutral"
   rule), and the Other sport card's add row ran past the card edge. */
.row.action,.mini.wide,.sheet .bigstep button{color:var(--label)}
.row[data-act="pick"] svg,.row[data-g="mBr"] svg{stroke:var(--label)}
.schips{grid-template-columns:minmax(0,1fr)}
/* Gauge rule: numbers in the gauge face, words in the legible face (Atkinson's zero is always slashed, which is
   right for reading words and noisy in data) */
:is(#v-today,#v-train,#v-money,#v-progress,#v-settings,#wk,.sheet) :is(.num,.dl-tile b,.tk-s,.tk-k em,.stats .stat b,.sum-grid b,.row .k,.exh-r .num,.wk-prev,.wk-in,.sum-mus li b,.mmap .ms-row b,.cd,.wk-best,.mm-nav span,.sum-hero p,.num small,.wk-plates b){font-family:var(--num)}

/* review fixes for the Gauge system (31 Oct) */
.bm-base,.bm-sel{fill:#222228}.mm-key i{background:#222228}
.dl-day.ok u.on,.dl-day.now u.on{background:var(--cal)}.dl-day.part u.on{background:color-mix(in srgb,var(--cal) 45%,transparent)}.dl-day.now>b{color:var(--label)}
input[switch]{accent-color:var(--label2)}
.su-chip[aria-pressed="true"]{background:transparent;color:var(--label);box-shadow:inset 0 0 0 1.5px var(--label)}
.sum-medal{background:var(--trn);color:#0b0b0e}.sum-medal.pr{background:var(--yel);color:#14140a}
.prtag{background:transparent;color:var(--yel);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--yel) 55%,transparent);font:500 11px/1.45 var(--mono);border-radius:6px;padding:0 6px}
.sum-hero h3{font-family:var(--display);letter-spacing:-.01em}
.chiprow{margin:8px 0 12px}.today-chip{margin-top:8px}.chiprow .today-chip{margin:0}
.wk-row.cur{padding:4px 10px}
:is(#v-settings,.sheet) .row input[type=number]{font-family:var(--num);font-size:17px}
.wk-set,.wrv-range{font-family:var(--num)}
/* long sheets: grid rows size to their content; overflow:hidden lists used to collapse to 0 once a sheet scrolled */
.sheet-body{grid-auto-rows:max-content}
/* toggles are controls, not data: neutral when on (native iOS switch uses accent-color; the drawn fallback uses background) */
input[switch]:checked{background:var(--label2)}
/* settings: units in one column so the numbers line up */
.s-unit{color:var(--label2);min-width:2.2em;text-align:left}
/* ---------- Detailed look (4 Nov, Cronometer-style layout in Fuel's own type and colour) ----------
   Owner asked for Cronometer's calorie tracking layout: Energy Summary rings (Consumed / Burned / Remaining)
   with target bars, a diary with per-meal subtotals, and Nutrient Targets grouped like a lab report.
   Whole app gets denser: tighter rows, smaller headings, 14px card radius. Dark stays. Settings → Today Screen → Layout: Tank brings the tank back. */
body[data-look="dense"]{--r:14px}
body[data-look="dense"] .gap{height:16px}
body[data-look="dense"] .card,body[data-look="dense"] .list,body[data-look="dense"] .dl-tile,body[data-look="dense"] .dl-weigh,body[data-look="dense"] .dl-week,body[data-look="dense"] #v-train .card,body[data-look="dense"] #v-train .list,body[data-look="dense"] .start-card,body[data-look="dense"] .wk-ex{border-radius:14px}
body[data-look="dense"] .card{padding:14px}
body[data-look="dense"] .row{padding:9px 14px;min-height:46px;gap:2px 10px}
body[data-look="dense"] .row .t{font-size:16px}
body[data-look="dense"] .row .d{font-size:13px}
body[data-look="dense"] .row .k{font-size:16px}
body[data-look="dense"] .sec,body[data-look="dense"] #v-train .sec{font-size:15px;margin:0 4px 6px;color:var(--label2);font-weight:600}
body[data-look="dense"] .large,body[data-look="dense"] #v-train .large{font-size:30px}
body[data-look="dense"] .start-card h2{font-size:28px}
/* Energy Summary */
.es{display:grid;gap:14px;touch-action:pan-y}
.es-top{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.es-c{display:grid;justify-items:center;gap:2px;min-width:0}
.es-r{position:relative;width:84px;height:84px}
.es-r svg{width:84px;height:84px;transform:rotate(-90deg)}
.es-r b{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--num);letter-spacing:-.01em}
.es-l{font:600 13px var(--font);color:var(--label);margin-top:4px}
.es-s{font:400 11px var(--font);color:var(--label3)}
.tg{display:grid;gap:10px;border-top:1px solid var(--sep);padding-top:12px}
.tg-r{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:2px 10px}
.tg-n{font:600 15px var(--font)}
.tg-v{font:500 13px var(--font);color:var(--label2);text-align:right}
.tg-p{font:700 15px var(--num);min-width:42px;text-align:right}
.tg-t{grid-column:1/-1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.tg-t i{display:block;height:100%;border-radius:3px}
.tg-r.over .tg-p{color:var(--red)}
.es-f{margin:0;font-size:12px;color:var(--label3);line-height:1.4}
/* Diary */
.list.dy>li.dy-h,.list.dy>li.dy-tot{padding:10px 14px 6px;background:color-mix(in srgb,var(--fill) 45%,transparent)}
.list.dy>li.dy-h::before,.list.dy>li.dy-tot::before{left:0!important}
.dy-h>div,.dy-tot>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dy-h b,.dy-tot b{font:600 15px var(--font)}
.dy-h span,.dy-tot span{font:700 15px var(--num)}
.dy-h p,.dy-tot p{margin:1px 0 0;font:400 12px var(--font);color:var(--label2);text-align:right}
.list.dy>li.dy-h+li::before{display:none}
.row.dy-r{min-height:44px}
.row.dy-r .d{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row.dy-r .k{display:grid;justify-items:end;line-height:1.15;font:600 16px var(--num)}
.row.dy-r .k small{font:400 11px var(--font);color:var(--label3)}
.list.dy>li.dy-tot{background:none;padding:10px 14px 10px}
.list.dy>li.dy-tot b,.list.dy>li.dy-tot span{color:var(--cal)}
/* Nutrient Targets */
.nt{padding:4px 14px 12px}
.nt-g{border-bottom:1px solid var(--sep)}
.nt-g>summary{display:flex;justify-content:space-between;align-items:center;padding:12px 0;cursor:pointer;list-style:none}
.nt-g>summary::-webkit-details-marker{display:none}
.nt-g>summary b{font:600 15px var(--font)}
.nt-g>summary b::after{content:"";display:inline-block;width:6px;height:6px;margin:0 0 3px 8px;border-right:1.6px solid var(--label3);border-bottom:1.6px solid var(--label3);transform:rotate(45deg);transition:transform .2s var(--e-out)}
.nt-g[open]>summary b::after{transform:rotate(225deg);margin-bottom:0}
.nt-g>summary span{font:400 12px var(--font);color:var(--label2)}
.nt-r{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;align-items:baseline;gap:3px 10px;width:100%;background:none;border:0;padding:6px 0 7px;text-align:left;color:inherit;font:inherit}
.nt-r:last-child{padding-bottom:12px}
.nt-n{font-size:14px;overflow-wrap:anywhere}
.nt-n i{font-style:normal;color:var(--label3);margin-left:2px}
.nt-v{font:500 13px var(--font);text-align:right}
.nt-v small{font-size:12px;color:var(--label3)}
.nt-p{font:700 14px var(--num);text-align:right;color:var(--label2)}
.nt-t{grid-column:1/-1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.nt-t i{display:block;height:100%;border-radius:2px;background:var(--label2)}
.nt-r.none .nt-t{display:none}
.nt-r.met .nt-t i{background:var(--pro)}.nt-r.met .nt-p{color:var(--pro)}
.nt-r.low .nt-t i{background:var(--cal)}
.nt-r.over .nt-t i{background:var(--red)}.nt-r.over .nt-p{color:var(--red)}
.nt .nfoot{margin:10px 0 0}
.nt-sum{margin:0 4px 12px;font:400 15px var(--font);color:var(--label2)}.nt-sum b{font:700 22px var(--num);color:var(--label)}
/* ---------- Amount pad (5 Nov) ---------- */
.amt{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.amt-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity 240ms var(--e-out)}
.amt-p{position:relative;width:100%;max-width:520px;background:var(--cell);border-radius:20px 20px 0 0;box-shadow:inset 0 1px 0 var(--hair);padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:grid;gap:12px;transform:translateY(100%);transition:transform 280ms var(--e-out)}
.amt.on .amt-bg{opacity:1}.amt.on .amt-p{transform:none}
@media (prefers-reduced-motion:reduce){.amt-p{transition:opacity 200ms;transform:none;opacity:0}.amt.on .amt-p{opacity:1}}
.amt-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:44px}
.amt-top b{text-align:center;font:600 16px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt-top .txtbtn{font-size:16px;color:var(--label2)}
.amt-done{background:var(--btn);color:var(--btn-ink);border:0;border-radius:99px;padding:0 18px;min-height:38px;font:700 16px var(--font)}
.amt-done:active{transform:scale(.97)}
.amt-note{margin:0;text-align:center;font-size:13px;color:var(--label2)}
.amt-big{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}
.amt-big>button{height:52px;border-radius:14px;border:0;background:var(--fill);color:var(--label);font:500 26px var(--font)}
.amt-v{display:flex;align-items:baseline;justify-content:center;gap:8px;min-width:0}
.amt-v b{font:700 54px/1 var(--num);letter-spacing:-.02em}
.amt-v.fresh b{color:var(--label);text-decoration:underline 2px var(--label3);text-underline-offset:8px}
.amt-v span{font:500 17px var(--font);color:var(--label2)}
.amt-k{margin:-4px 0 0;text-align:center;font:500 14px var(--font);color:var(--label2)}
.amt-q{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.amt-q::-webkit-scrollbar{display:none}
.amt-q .chip2{flex:0 0 auto;white-space:nowrap}
.amt-q .chip2.on{box-shadow:inset 0 0 0 1.5px var(--label)}
.amt-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.amt-keys button{height:52px;border:0;border-radius:12px;background:var(--fill);color:var(--label);font:600 24px var(--num);display:grid;place-items:center}
.amt-keys button:active,.amt-big>button:active{transform:scale(.97);background:color-mix(in srgb,var(--fill) 60%,var(--label3))}
.qin,#eQtyIn{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;display:inline-block;color:var(--label)}
.stepper .qin{min-height:32px;line-height:32px}
#eQtyIn{line-height:1}

/* ---------- Routine switcher (5 Nov) ---------- */
.rt-pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px -14px 12px;padding:2px 14px;scroll-snap-type:x proximity}
.rt-pills::-webkit-scrollbar{display:none}
.rt-pill{flex:0 0 auto;scroll-snap-align:start;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:99px;border:0;background:var(--fill);color:var(--label2);font:600 15px var(--font);white-space:nowrap}
.rt-pill small{font:500 11px var(--mono);color:var(--label3)}
.rt-pill[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.rt-pill[aria-selected="true"] small{color:color-mix(in srgb,var(--btn-ink) 60%,transparent)}
.rt-pill.add{padding:0 13px;font-size:19px;font-weight:500}
.rt-pill:active{transform:scale(.97)}
.sc-acts{display:flex;gap:14px}
.sc-name{all:unset;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sc-name:focus-visible{outline:2px solid var(--label);outline-offset:2px;border-radius:4px}
.start-card .sc-sub{margin:2px 0 8px}

/* ---------- Restaurants (5 Nov) ---------- */
.rest-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.rest-chips .chip2 small{margin-left:6px;font:500 11px var(--mono);color:var(--label3)}
.ds-chain{color:var(--label2)}
.rest-src{margin:2px 4px 8px;text-align:left}
/* ---------- Food details + diary rows + summary at bottom (9 Nov, Detailed look) ---------- */
.fd{position:fixed;inset:0;z-index:65;background:var(--bg);transform:translateX(100%);transition:transform 300ms var(--e-out)}
.fd.on{transform:none}
@media (prefers-reduced-motion:reduce){.fd{transform:none;opacity:0;transition:opacity 200ms}.fd.on{opacity:1}}
.fd-p{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top)}
.fd-bar{padding:8px 16px}
.fd-body{overflow-y:auto;padding:4px 16px 16px;display:grid;gap:12px;align-content:start}
.fd-name{margin:0;font:700 26px/1.15 var(--display);text-wrap:balance}
.fd-src{margin:-4px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--label2)}
.fd-amt{display:grid;gap:10px}
.fd-num{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:12px 16px;border-radius:14px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--hair)}
.fd-num b{font:700 40px/1 var(--num);text-decoration:underline 2px var(--label3);text-underline-offset:7px}
.fd-num span{font:500 17px var(--font);color:var(--label2)}
.fd-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;padding:12px 6px;border-radius:14px;background:var(--cell)}
.fd-sum b{display:block;font:700 22px var(--num)}.fd-sum span{font-size:12px;color:var(--label2)}
.fd-split{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--fill)}
.fd-split i{display:block;min-width:2px}
.fd-pct{margin:-6px 0 0;font-size:13px;color:var(--label2)}
.fd-mi{list-style:none;margin:0;padding:0 14px;border-radius:14px;background:var(--cell)}
.fd-mi li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--sep);font-size:15px}
.fd-mi li:last-child{border-bottom:0}.fd-mi b{font-weight:600}
.fd-foot{display:grid;gap:4px;justify-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--sep);background:var(--bg)}
.fd-foot .btn{width:100%}
/* diary rows: time, name, amount, macro bar, kcal */
.row.dy-r{display:grid;grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"tm t k" "tm d k" "tm bar k";align-items:center;column-gap:10px}
.row.dy-r .tm{grid-area:tm;align-self:start;padding-top:2px;font:500 12px var(--mono);color:var(--label3)}
.row.dy-r .t{grid-area:t}.row.dy-r .d{grid-area:d}.row.dy-r .k{grid-area:k}
.row.dy-r.th{grid-template-columns:44px auto minmax(0,1fr) auto;grid-template-areas:"tm img t k" "tm img d k" "tm img bar k"}
.row.dy-r.th .thumb{grid-area:img}
.row.dy-r .pick{grid-area:tm}
.dy-bar{grid-area:bar;display:flex;height:4px;border-radius:2px;overflow:hidden;gap:1px;max-width:180px;margin-top:3px}
.dy-bar i{display:block}
.dy-h .dy-add{all:unset;cursor:pointer;margin-left:8px;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--fill);color:var(--label);font:500 18px/1 var(--font);vertical-align:middle;position:relative}
.dy-h .dy-add::before{content:"";position:absolute;inset:-9px}
.dy-h>div>b{display:flex;align-items:center}
.es-sum-h{margin-top:4px}

/* ---------- Fast logging (9 Nov) ---------- */
.ql{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 6px;padding:2px 16px;scroll-snap-type:x proximity}
.ql::-webkit-scrollbar{display:none}
.ql-b{flex:0 0 auto;scroll-snap-align:start;display:grid;gap:2px;text-align:left;max-width:170px;padding:10px 14px;border-radius:14px;border:0;background:var(--cell);box-shadow:inset 0 0 0 1px var(--hair);color:var(--label)}
.ql-b b{font:600 15px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ql-b span{font-size:12px;color:var(--label2);white-space:nowrap}
.ql-b:active{transform:scale(.97)}
.sec .muted{font-weight:400;font-size:12px;color:var(--label3);margin-left:6px}
.snapbtn{position:fixed;left:calc(50% - 116px);bottom:calc(66px + env(safe-area-inset-bottom));z-index:25;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--cell);color:var(--label);box-shadow:inset 0 0 0 1px var(--hair);cursor:pointer}
.snapbtn svg{width:24px;height:24px}
.snapbtn:active{transform:scale(.97)}
.snapbtn[hidden]{display:none}.snapbtn.away{opacity:0;pointer-events:none}
/* ---------- Money ----------
   The fifth tab. Plain tracking, so there is no target line and nothing turns red: spending is drawn in the label
   colour (luminance, like training's chalk) and the food colours stay food's. Sizes, gaps and corners are on Fuel's scales. */
.mny-hero{display:grid;gap:14px}
.mny-lab{display:block;font:500 13px var(--font);color:var(--label2)}
.mny-big{display:flex;align-items:baseline;gap:6px;margin:2px 0 0}
.mny-big b{font:600 54px/1 var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mny-big span{font:500 17px var(--font);color:var(--label2)}
.mny-delta{margin:6px 0 0;font:400 13px var(--font);color:var(--label2);min-height:18px}
.mny-delta b{font-weight:600;color:var(--label)}
.mny-delta b.dn{color:var(--green)}
.chart.mny-chart{margin-top:0}
.mny-prev{stroke:var(--label3);stroke-width:1.5;stroke-dasharray:2 4;stroke-linecap:round}
.legend i.mny-dash{width:12px;height:0;border-radius:0;border-top:2px dotted var(--label3);background:none!important;vertical-align:3px}
.mny-stats .stat b{font-size:28px}
.row.mny-c{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t k" "bar bar" "d d";gap:6px 10px;padding:12px 16px}
.row.mny-c .t{grid-area:t}
.row.mny-c .k{grid-area:k;color:var(--label);font:600 17px var(--num)}
.row.mny-c .d{grid-area:d;font-size:13px}
.mny-bar{grid-area:bar;display:block;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.mny-bar i{display:block;height:100%;border-radius:2px;background:var(--label)}
.row.mny-r .k{color:var(--label)}
.row.mny-r .d .ds{margin-right:0}
.mny-setup{margin-top:14px}
a.mny-line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"l v c" "s v c";align-items:center;gap:2px 10px;padding:12px 16px;margin-top:10px;text-decoration:none;color:var(--label)}
.mny-line .mny-lab{grid-area:l}
.mny-line b{grid-area:v;font:600 22px/1 var(--num);letter-spacing:-.01em}
.mny-line b i{font:500 13px var(--font);font-style:normal;color:var(--label2);letter-spacing:0}
.mny-line .s{grid-area:s;font:400 13px var(--font);color:var(--label2)}
.mny-line .chev{grid-area:c;width:8px;height:14px;color:var(--label3)}
a.mny-line:active{transform:scale(.97)}
.mny-how .bk-t{font-weight:400;line-height:1.4;margin:0}
.mny-steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.mny-steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;font-size:15px;line-height:1.4;color:var(--label2)}
.mny-steps li>b{width:24px;height:24px;border-radius:50%;background:var(--fill);color:var(--label);display:grid;place-items:center;font:600 13px var(--num)}
.mny-steps span b,.mny-how .bk-t b{color:var(--label);font-weight:600}
.mny-link{display:grid;gap:8px;margin-top:14px}
.mny-link code{display:block;font:500 12px/1.5 var(--mono);color:var(--label2);background:var(--fill);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
/* the spend pad sits on the amount pad's shell; it follows the visible area so the keyboard never covers it */
.amt.sp{inset:auto 0 auto 0;top:var(--vvt,0px);height:var(--vvh,100dvh)}
.sp-v{align-items:baseline}
.sp-v span{order:-1}
.sp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.sp-row input{min-width:0;min-height:44px;border:0;border-radius:10px;background:var(--fill);color:var(--label);font:400 16px var(--font);padding:0 12px;outline:none;-webkit-appearance:none;appearance:none}
.sp-row input::placeholder{color:var(--label3)}
.sp-row input:focus-visible{box-shadow:inset 0 0 0 1.5px var(--label2)}
.sp-date{position:relative;display:grid;place-items:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--fill);color:var(--label);font:500 15px var(--font);white-space:nowrap}
.sp-date input{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:0;opacity:0;color-scheme:dark}
.sp-date:focus-within{box-shadow:inset 0 0 0 1.5px var(--label2)}
.sp-cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sp-cats .chip2{position:relative;min-height:44px;padding:0 4px;border-radius:10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-cats .chip2::before{display:none}
.sp-cats .chip2[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--label)}
.sp .amt-note{min-height:18px}
.sp-usual .chip2 b{font:600 15px var(--num);color:var(--label2);margin-left:4px}
.sp-pb{display:grid;gap:8px}
.sp-pb textarea{width:100%;box-sizing:border-box;border:0;border-radius:10px;background:var(--fill);color:var(--label);font:400 16px/1.4 var(--font);padding:10px 12px;resize:none;outline:none}
.sp-foot{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.sp-foot .txtbtn{font-size:15px;color:var(--label2);padding:0}
.sp-foot .sp-del{color:var(--red);margin-left:auto}
.amt-top .sp-paste{color:var(--label);font-weight:600}
.sp.typing .amt-keys,.sp.typing .sp-usual,.sp.typing .sp-foot{display:none}
[hidden].sp-usual,.sp-pb[hidden]{display:none}
#v-money .list .row .k{color:var(--label)}
/* a toast is as wide as its words (it used to wrap at half the screen because it is centred from left:50%) */
.toast{width:max-content}
a.mny-line{transition:transform 160ms var(--e-out)}
a.mny-line:active{transition-duration:90ms}
.sp-foot .txtbtn{min-height:44px}
/* leaving is quicker than arriving */
.amt.sp:not(.on) .amt-p{transition-duration:200ms}
.amt.sp:not(.on) .amt-bg{transition-duration:160ms}
/* swipe a spend left to delete it, as on Today */
#v-money .list>li.swiping button.row{background:var(--cell)!important}
#v-money .list>li.swiping{background:var(--red)}
#v-money .list>li.swiping::after{content:"Delete";position:absolute;right:20px;top:50%;transform:translateY(-50%);color:#fff;font-weight:600;font-size:17px;z-index:0;opacity:.55;transition:opacity .15s}
#v-money .list>li.swiping.armed::after{opacity:1}
#v-money .list>li.gone{transition:height .25s var(--ease-out),opacity .2s;overflow:hidden;opacity:0}
#v-money .list button.mny-r{touch-action:pan-y;position:relative;z-index:1;background:var(--cell)}
#v-money .list .row.mny-c,#v-money .list .row.mny-r,#gBody .row.mny-r{padding-top:10px;padding-bottom:10px}
.sp .amt-top .txtbtn{min-height:44px}
.sp .amt-done{min-height:44px;padding:0 20px}
.amt-keys button{font-size:22px}
.sp .amt-p{max-height:100%;overflow-y:auto;overscroll-behavior:contain}
@media (max-height:700px){.sp .amt-p{gap:8px}.sp .amt-keys button{height:44px}.sp .sp-v b{font-size:44px}}
.sp .amt-top{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.sp .amt-top>:first-child{justify-self:start}
.sp .amt-top>:last-child{justify-self:end}
.mny-steps kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:6px;background:var(--fill);color:var(--label);font:500 13px var(--mono)}
.mny-file{display:grid;place-items:center;margin-top:14px;cursor:pointer}
.mny-imp{font-size:15px;padding:0;color:var(--label);font-weight:600;cursor:pointer;position:relative}
.mny-imp::before{content:"";position:absolute;inset:-12px -8px}
</style>
</head>
<body>
<div class="navbar" aria-hidden="true"><span class="small" id="smallTitle">Today</span></div>
<main class="wrap">
  <section class="view" id="v-today" aria-label="Today"></section>
  <section class="view" id="v-train" aria-label="Train" hidden></section>
  <section class="view" id="v-money" aria-label="Money" hidden></section>
  <section class="view" id="v-progress" aria-label="Progress" hidden></section>
  <section class="view" id="v-settings" aria-label="Settings" hidden></section>
</main>

<label class="snapbtn" for="snapIn" id="snapBtn" aria-label="Snap a photo of your food" onclick="openAdd()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg></label><button class="addbtn" id="addBtn" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add Food</button><button class="addbtn" id="spendBtn" data-m="add" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add Spend</button>

<div id="setup" class="setup" role="dialog" aria-modal="true" aria-label="Set up Fuel" hidden></div>
<nav class="tabbar" aria-label="Sections"><div class="wrap"><i class="tb-ind" aria-hidden="true"></i>
  <a href="#today" data-route="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5" opacity=".3"/><path d="M12 3.5a8.5 8.5 0 0 1 8.2 10.8"/></svg>Today</a>
  <a href="#train" data-route="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Train</a>
  <a href="#money" data-route="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12.5" rx="2.6"/><path d="M3.5 10.5h17M7 15h3.5"/></svg>Money</a>
  <a href="#progress" data-route="progress"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="12" width="4" height="8" rx="1.4"/><rect x="10" y="7" width="4" height="13" rx="1.4"/><rect x="16.5" y="3.5" width="4" height="16.5" rx="1.4"/></svg>Progress</a>
  <a href="#settings" data-route="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>Settings</a>
</div></nav>

<!-- Add food sheet -->
<div class="sheet tall" id="addSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="grab"><div class="grabber"></div>
      <div class="sheet-bar"><button class="txtbtn" data-act="closeAdd">Cancel</button><h2 id="addTitle">Add Food</h2><span></span></div></div>
    <div class="sheet-body" id="addBody">
      <div class="seg" id="mealSeg" role="group" aria-label="Meal"></div>
      <div id="quickLog"></div>
      <div id="usual"></div>
      <div class="tiles">
        <label class="tile press" for="snapIn" id="snapTile"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg></span>Snap Photo<small>Barcode, label or meal</small></label>
        <button class="tile press" data-act="describe" id="descTile"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18.5V6.5A1.5 1.5 0 0 1 6.5 5h11A1.5 1.5 0 0 1 19 6.5v8a1.5 1.5 0 0 1-1.5 1.5H9z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/></svg></span>Describe It<small id="descSub">Type what you ate</small></button>
        <button class="tile press" data-act="manual" id="exactTile"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h14M5 17h9"/><path d="M17.5 15.5v5M15 18h5"/></svg></span>Enter Exact<small>Your own numbers</small></button>
      </div>
      <input type="file" id="snapIn" accept="image/*" capture="environment" hidden>
      <input type="file" id="labelIn" accept="image/*" capture="environment" hidden>
      <div class="status" id="status" hidden></div>

      <div id="descBox" hidden style="display:grid;gap:10px">
        <textarea id="descIn" aria-label="What did you eat?" placeholder="e.g. 3 scrambled eggs, 1 slice brown toast and a karak"></textarea>
        <div class="examples">
          <button data-act="ex">Chicken shawarma plate with fries</button>
          <button data-act="ex">250 g grilled chicken and 1 cup rice</button>
          <button data-act="ex">Double smash burger and Coke Zero</button>
        </div>
        <button class="btn" data-act="estimate" id="estBtn">Estimate</button>
      </div>

      <div id="manualBox" hidden class="exact">
        <div class="grid4">
          <div class="field"><label for="mK">kcal</label><input type="number" id="mK" inputmode="decimal" min="0" placeholder="0"></div>
          <div class="field"><label for="mP">Protein g</label><input type="number" id="mP" inputmode="decimal" min="0" placeholder="0"></div>
          <div class="field"><label for="mC">Carbs g</label><input type="number" id="mC" inputmode="decimal" min="0" placeholder="0"></div>
          <div class="field"><label for="mF">Fat g</label><input type="number" id="mF" inputmode="decimal" min="0" placeholder="0"></div>
        </div>
        <p class="ex-hint" id="mHint" aria-live="polite">Type calories, macros, or both. Leave calories empty and Fuel works them out from the macros.</p>
        <div class="field"><label for="mName">Name <span class="muted">(optional, saves it to My Foods)</span></label><input type="text" id="mName" placeholder="e.g. Mum’s machboos" autocapitalize="sentences" enterkeyhint="done"></div>
        <details class="more"><summary>Serving, label and fiber</summary><div style="display:grid;gap:10px;margin-top:10px">
          <div class="field"><label>Numbers are per</label><div class="seg" role="group" aria-label="Values per"><button data-act="mper" data-v="srv" aria-pressed="true">Serving</button><button data-act="mper" data-v="g" aria-pressed="false">100 g</button><button data-act="mper" data-v="ml" aria-pressed="false">100 ml</button></div></div>
          <div class="grid2" id="mSrvRow"><div class="field"><label for="mServ">Serving</label><input type="text" id="mServ" value="1 serving"></div><div class="field"><label for="mSz">Serving size</label><div class="unitin"><input type="number" id="mSz" inputmode="decimal" min="0" placeholder="optional"><select id="mUn" aria-label="Unit"><option>g</option><option>ml</option></select></div></div></div>
          <div class="grid3">
            <div class="field"><label for="mFb">Fiber g</label><input type="number" id="mFb" inputmode="decimal" min="0"></div>

function tickRest(){
  const bar=$('#restBar'), w=W(); if(!bar) return;
  const c=$('#wkClock'); if(c&&w&&!S.ui.edit) c.textContent=dur(Date.now()-w.start);
  if(S.ui.edit||!S.ui.restEnd){bar.hidden=true; return}
  const left=S.ui.restEnd-Date.now();
  if(left<=0){ bar.hidden=true; if(!S.ui.flashed){S.ui.flashed=true; flashRest()} return }
  bar.hidden=false; const s=Math.ceil(left/1000), pct=1-left/(S.ui.restTotal*1000);
  const at=new Date(S.ui.restEnd), dots=bar.querySelector('.rb-dots'), N=24;
  /* one dot per 1/24 of the rest; they switch off from the right as time runs out */
  if(dots.childElementCount!==N) dots.innerHTML='<u></u>'.repeat(N);
  const on=Math.ceil((1-pct)*N); [...dots.children].forEach((u,i)=>u.classList.toggle('off',i>=on));
  if(s<=3&&s>0&&tickRest.last!==s&&S.ui.restEnd===tickRest.end){sfx.tick()} tickRest.last=s; tickRest.end=S.ui.restEnd;
  bar.querySelector('.rb-t').textContent=`${Math.floor(s/60)}:${pad(s%60)}`;
  bar.querySelector('.rb-at').textContent=`Next set at ${pad(at.getHours())}:${pad(at.getMinutes())}`;
}
function flashRest(){haptic('confirm'); const f=$('#flash'); f.hidden=false; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); setTimeout(()=>{f.hidden=true},1400)}
function startRest(sec){S.ui.restEnd=Date.now()+sec*1000; S.ui.restTotal=sec; S.ui.flashed=false; saveUI(); restSound.schedule(S.ui.restEnd); tickRest()}

function setDone(xi,si){const x=W()&&W().ex[xi]; if(x) withU(exUnit(kx(x)),()=>setDone0(xi,si))}
function setDone0(xi,si){
  const w=W(), x=w.ex[xi], s=x.sets[si], ex=exById(x.eid), ty=exType(ex,x), kgCol=ty!=='bw'&&ty!=='dur', none=v=>v==null||v==='';
  if(s.done){s.done=false; s.pr=false; s.u=Date.now(); S.ui.edit?0:saveSession(w); renderWorkout(); return}
  /* ticking an empty field uses the grey number shown in it: today's plan, else the same set last time */
  const pv=prevFor(S.ui.edit?null:S.lifts.ex[kx(x)],x,si);
  if(kgCol&&none(s.kg)&&pv&&(ty==='wr'||+pv.kg>0)) s.kg=+pv.kg;
  if(!(+s.reps>0)&&pv&&+pv.reps>0) s.reps=+pv.reps;
  if(ty==='wr'&&none(s.kg)){toast('Enter the weight first'); return}
  if(!(+s.reps>0)){toast(ty==='dur'?'Enter the time first':'Enter your reps first'); return}
  if(!kgCol) s.kg=null;
  s.done=true; s.ph=0; delete s.phk; delete s.phr; s.u=Date.now(); haptic();
  if(s.t!=='w') x.sets.forEach((q,i)=>{if(i<=si||q.done||q.t==='w'||q.t==='d') return; const nk=kgCol&&none(q.kg)&&!none(s.kg), nr=!(+q.reps>0);
    if(nk){q.kg=s.kg; if(!q.ph) q.phk=1} if(nr){q.reps=s.reps; if(!q.ph) q.phr=1}});
  let isPR=false;
  if(!S.ui.edit&&s.t!=='w'){
    const base0=(w.prBase||{})[kx(x)], already=x.sets.some(q=>q.pr);
    const cand={kg:+s.kg||0,reps:+s.reps,e:isFree(ex)?e1rm(+s.kg,+s.reps):0};
    if(base0&&!already&&betterThan(ex,cand,base0)){s.pr=true; isPR=true}
  }
  if(!S.ui.edit&&si===0&&x.rx&&x.rx.scheme==='rp'&&s.t!=='w'){const inc=stepFor(ex,x.m); x.sets.forEach((q,i)=>{if(i>0&&!q.done&&q.ph){q.kg=roundTo((+s.kg||0)*(1-0.1*i),inc)}})}
  if(!S.ui.edit){saveSession(w); const nx=x.sets.slice(si+1).find(q=>!q.done), more=nx||w.ex.slice(xi+1).some(y=>y.sets.some(q=>!q.done)); if(more&&!(nx&&nx.t==='d')) startRest(s.t==='w'?60:(x.rest||120))}
  renderWorkout();
  const row=$(`[data-row="${xi}-${si}"]`); if(row){row.classList.add('pop'); if(isPR){haptic('confirm'); toast(`New PR · ${ex.n}`); if(motionOK()){row.insertAdjacentHTML('beforeend',stampHTML('New PR','pr',true)); sfx.thump(0.17)}}}
}

/* ---------- Hevy CSV import (format per Hevy's export: title,start_time,end_time,…,exercise_title,…,set_type,weight_kg,reps,…) ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true; else if(c===','){row.push(f);f=''} else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f='' } else f+=c }
  if(f!==''||row.length){row.push(f); rows.push(row)}
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseWhenTs(s){
  s=String(s||'').trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[T ]?(\d{1,2})?:?(\d{2})?/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||12),+(m[5]||0)).getTime();
  m=s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?\s+(\d{4}),?\s*(\d{1,2})?:?(\d{2})?/); if(m&&MONTHS[m[2].slice(0,3).toLowerCase()]) return new Date(+m[3],MONTHS[m[2].slice(0,3).toLowerCase()]-1,+m[1],+(m[4]||12),+(m[5]||0)).getTime();
  m=s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4}),?\s*(\d{1,2})?:?(\d{2})?/); if(m&&MONTHS[m[1].slice(0,3).toLowerCase()]) return new Date(+m[3],MONTHS[m[1].slice(0,3).toLowerCase()]-1,+m[2],+(m[4]||12),+(m[5]||0)).getTime();
  return NaN;
}
function kindFromTitle(t){const p=(String(t).match(/\(([^)]*)\)/)||[])[1]||''; return /barbell|ez bar|trap bar/i.test(p)?'bb':/dumbbell|kettlebell/i.test(p)?'db':/cable|band/i.test(p)?'cb':/machine|smith|plate|lever/i.test(p)?'mc':/bodyweight|weighted|assisted/i.test(p)?'bw':'mc'}
function muscleFromTitle(t){const n=t.toLowerCase(); return /bench|chest|fly|dip|push up/.test(n)?'Chest':/row|pulldown|pull up|chin|deadlift|shrug|back/.test(n)?'Back':/shoulder|lateral|overhead|delt|face pull|arnold/.test(n)?'Shoulders':/curl|tricep|skull|extension \(cable\)|pushdown/.test(n)&&!/leg/.test(n)?'Arms':/hip thrust|glute|abduct/.test(n)?'Glutes':/squat|leg|lunge|calf|rdl|romanian/.test(n)?'Legs':/crunch|plank|ab|raise/.test(n)?'Core':'Other'}
function resolveEx(title){
  const n=normName(title), hit=EXLIB.find(e=>normName(e.n)===n)||(EX_ALIAS[n]&&exById(EX_ALIAS[n]))||(S.lifts.custom||[]).find(e=>normName(e.n)===n);
  if(hit) return hit.id;
  const bare=normName(String(title).replace(/\(.*\)/,'')), loose=EXLIB.find(e=>normName(e.n.replace(/\(.*\)/,''))===bare&&kindFromTitle(title)===e.k);
  if(loose) return loose.id;
  const id='c-'+n.slice(0,40); if(!S.lifts.custom.some(c=>c.id===id)) S.lifts.custom.push({id,n:String(title).trim(),m:muscleFromTitle(title),k:kindFromTitle(title)});
  return id;
}
function importHevy(text){
  const rows=parseCSV(text); if(rows.length<2) throw new Error('empty');
  const H=rows[0].map(h=>h.trim().toLowerCase()), ix=k=>H.indexOf(k);
  const iT=ix('title'), iS=ix('start_time'), iE=ix('end_time'), iX=ix('exercise_title'), iY=ix('set_type'), iKg=ix('weight_kg'), iLb=ix('weight_lbs'), iR=ix('reps'), iD=ix('duration_seconds'), iP=ix('rpe');
  if(iX<0||iS<0||iR<0) throw new Error('not hevy');
  const byW=new Map();
  for(const r of rows.slice(1)){
    const st=parseWhenTs(r[iS]); if(!isFinite(st)) continue;
    const eid=resolveEx(r[iX]), dt=exType(exById(eid))==='dur';
    let reps=Math.round(+r[iR]||0); if(dt&&iD>=0&&+r[iD]>0) reps=Math.round(+r[iD]);
    let kg=iKg>=0?+r[iKg]:NaN; if(!isFinite(kg)&&iLb>=0) kg=(+r[iLb]||0)*0.45359237; kg=isFinite(kg)?Math.round(kg*100)/100:0;
    if(!(reps>0)||kg<0||kg>600||reps>(dt?3600:200)) continue;
    const key=(r[iT]||'Workout')+'|'+st; let w=byW.get(key);
    if(!w){const et=parseWhenTs(r[iE]); w={kind:'workout',id:'h'+st.toString(36)+normName(r[iT]).slice(0,6),date:ymd(new Date(st)),name:(r[iT]||'Workout').trim(),rid:null,start:st,end:isFinite(et)&&et>st?et:st+3600e3,ex:[],del:[],src:'hevy'}; byW.set(key,w)}
    let x=w.ex.find(q=>q.eid===eid); if(!x){x={eid,rest:120,sets:[]}; w.ex.push(x)}
    const ty=String(r[iY]||'').toLowerCase(), t=/warm/.test(ty)?'w':/fail/.test(ty)?'f':/drop/.test(ty)?'d':'n';
    const rpe=iP>=0?+r[iP]:0;
    x.sets.push({id:w.id+'-'+x.sets.length+'-'+eid.slice(0,6),kg,reps,t,done:true,u:st,...(rpe>=1&&rpe<=10?{rpe}:{})});
  }
  const list=[...byW.values()].sort((a,b)=>a.start-b.start); if(!list.length) throw new Error('no sets');
  for(const w of list) applySession(w); Object.values(S.lifts.ex).forEach(L=>L.imported=true);
  const keep=list.slice(-120); for(const w of keep){w.u=Date.now(); if(!S.wk[w.id]) saveSession(w)}
  if(S.routines.src!=='custom'){
    const freq=new Map(); list.slice(-60).forEach(w=>freq.set(w.name,(freq.get(w.name)||0)+1));
    const top=[...freq.entries()].sort((a,b)=>b[1]-a[1]).slice(0,4).map(([n])=>n);
    if(top.length){
      S.routines={v:1,src:'hevy',next:0,list:top.map((n,i)=>{const w=[...list].reverse().find(q=>q.name===n);
        return {id:'hv'+i,name:n,ex:w.ex.map(x=>{const work=x.sets.filter(s=>s.t!=='w'), reps=work.map(s=>s.reps); const lo=Math.min(...reps), hi=Math.max(...reps), first=work[0], rp=work.length>1&&work[0].kg>work[work.length-1].kg*1.08;
          return R(x.eid,Math.max(1,work.length),Math.max(1,rp?first.reps:lo),Math.max(lo,rp?first.reps:hi),isFree(exById(x.eid))?150:90,rp?'rp':'dp')})}})};
      const lastName=list[list.length-1].name, li=S.routines.list.findIndex(r=>r.name===lastName); S.routines.next=li>=0?li+1:0;
      saveRoutines();
    }
  }
  saveLifts();
  return {workouts:list.length,kept:keep.length,lifts:Object.keys(S.lifts.ex).length,routines:S.routines.src==='hevy'?S.routines.list.map(r=>r.name):null};
}

/* ---------- cut quality + measured maintenance ---------- */
function strengthVsWeight(){
  const since=addDays(TODAY(),-56), lifts=Object.entries(S.lifts.ex).filter(([id,L])=>isFree(exById(baseId(id)))&&(L.hist||[]).filter(h=>h.d>=since&&h.e).length>=2);
  const wk=d=>Math.floor((parseYmd(d)-parseYmd(since))/(7*864e5));
  const sIdx=[...Array(8)].map(()=>[]), wIdx=[...Array(8)].map(()=>[]);
  lifts.forEach(([,L])=>{const h=L.hist.filter(q=>q.d>=since&&q.e), b=h[0].e; h.forEach(q=>{const i=wk(q.d); if(i>=0&&i<8) sIdx[i].push(q.e/b*100)})});
  const wl=S.weights.list.filter(p=>p.date>=since); if(wl.length){const b=wl[0].kg; wl.forEach(p=>{const i=wk(p.date); if(i>=0&&i<8) wIdx[i].push(p.kg/b*100)})}
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {s:sIdx.map(av),w:wIdx.map(av),n:lifts.length};
}
function swvChart(){
  const d=strengthVsWeight(), sp=d.s.map((v,i)=>[i,v]).filter(p=>p[1]!=null), wp=d.w.map((v,i)=>[i,v]).filter(p=>p[1]!=null);
  if(sp.length<2||wp.length<2) return `<p class="foot" style="margin:6px 0 0">Needs 2+ weeks of lifts and weigh-ins. Keep logging both.</p>`;
  const all=[...sp,...wp].map(p=>p[1]), lo=Math.floor(Math.min(...all,98)), hi=Math.ceil(Math.max(...all,102));
  const W2=340,H2=150,L2=36,R2=8,T2=10,B2=22, x=i=>L2+i/7*(W2-L2-R2), y=v=>T2+(1-(v-lo)/(hi-lo))*(H2-T2-B2);
  const line=(p,c)=>`<polyline points="${p.map(([i,v])=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${p.map(([i,v])=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="10" fill="transparent" data-tip="Week ${i+1} · ${v.toFixed(1)}%"/>`).join('')}<circle cx="${x(p[p.length-1][0]).toFixed(1)}" cy="${y(p[p.length-1][1]).toFixed(1)}" r="4.5" fill="${c}" stroke="var(--cell)" stroke-width="2"/>`;
  const sLast=sp[sp.length-1][1], wLast=wp[wp.length-1][1];
  const verdict=sLast>=99&&wLast<100?['Strength is holding while your weight drops.','var(--green)']:sLast<97&&wLast<100?['Strength is falling with your weight. Keep protein at 150 g and don’t cut faster.','var(--red)']:['Not enough change yet to judge. Keep logging.','var(--label2)'];
  return `<div class="tipbox"><svg class="chart" viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Strength and bodyweight, indexed to 100 at the start">
    <line class="g" x1="${L2}" x2="${W2-R2}" y1="${y(100)}" y2="${y(100)}"/><text x="${L2-6}" y="${y(100)+4}" text-anchor="end">100</text><text x="${L2-6}" y="${y(lo)+4}" text-anchor="end">${lo}</text><text x="${L2-6}" y="${y(hi)+4}" text-anchor="end">${hi}</text>
    ${line(wp,'var(--label3)')}${line(sp,'var(--blue)')}<text x="${L2}" y="${H2-5}">8 weeks ago</text><text x="${W2-R2}" y="${H2-5}" text-anchor="end">This week</text></svg></div>
    <div class="legend"><span><i style="background:var(--blue)"></i>Strength (${d.n} lift${d.n===1?'':'s'})</span><span><i style="background:var(--label3)"></i>Bodyweight</span></div>
    <p class="verdict" style="color:${verdict[1]}">${verdict[0]}</p>`;

/* Burn estimate. Uses only days you logged fully: marked "All logged", or unmarked days that reach 60% of that day's goal
   (a forgotten dinner shouldn't read as a low-intake day). Days marked "Missed some" never count. */
function usableDays(n){
  const T=TODAY(), h={...(S.hist||{}),...S.days}, out=[]; let partial=0, logged=0;
  for(let i=1;i<=n;i++){const d=addDays(T,-i), day=h[d]; if(!day||!day.entries.length) continue; logged++;
    const k=totals(day).kcal, st=day.st&&day.st.s; if(st==='partial'){partial++; continue}
    if(st==='done'||k>=0.6*goalOn(d).kcal) out.push({d,k})}
  return {days:out,partial,logged};
}
function trendFit(pts){ // least squares over weigh-ins: slope kg/day and the trend value today
  const T=parseYmd(TODAY())/864e5, xs=pts.map(p=>parseYmd(p.date)/864e5-T), ys=pts.map(p=>p.kg), mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  let n=0,dn=0; xs.forEach((x,i)=>{n+=(x-mx)*(ys[i]-my);dn+=(x-mx)**2}); const slope=dn?n/dn:0; return {slope,now:my-slope*mx};
}
function measuredTDEE(){
  const u=usableDays(21), pts=S.weights.list.filter(p=>p.date>=addDays(TODAY(),-28)&&p.date<=TODAY());
  const span=pts.length?(parseYmd(pts[pts.length-1].date)-parseYmd(pts[0].date))/864e5:0;
  if(u.days.length<14) return {short:true,days:u.days.length,window:21,partial:u.partial,weighs:pts.length};
  if(pts.length<4||span<14) return {short:true,weighs:pts.length,days:u.days.length,window:21,noWeight:true};
  const f=trendFit(pts), intake=u.days.reduce((a,x)=>a+x.k,0)/u.days.length;
  return {tdee:Math.round((intake-f.slope*7700)/10)*10,intake:Math.round(intake),days:u.days.length,rate:f.slope*7,trend:f.now};
}
/* Weekly check-in: suggest the next calorie goal from the measured burn and the pace you chose.
   Guardrails: 14+ full days in 3 weeks, 2+ weeks of weigh-ins, at most 150 kcal per week, never under 1,800,
   protein fixed, carbs move first and fat never drops under 55 g, and no cut while lifts are slipping. */
const CI_CAP=150, FAT_FLOOR=45, CARB_FLOOR=100;
const ciFloor=()=>{const t=calcTargets(S.profile); return t?Math.max(S.profile.sex==='f'?1200:1500,Math.round(t.bmr/10)*10):1800};
function checkinCalc(){

const RING_SETS={kcal:['#ff9500','#ff9500'],pro:['#30d158','#30d158'],train:['#0a84ff','#0a84ff']};

/* Concentric rings, Apple-Activity style: gradient strokes, round caps, a lighter lap when a ring passes 100%. */
function activityRings(rings,size){
  const S2=size||168, sw=Math.round(S2*0.118), gap=Math.round(sw*0.18);
  let defs='', body='';
  rings.forEach((r,i)=>{
    const rad=(S2-sw)/2-i*(sw+gap), C=2*Math.PI*rad, cx=S2/2, pct=Math.max(0,r.pct||0), shown=Math.min(pct,1), lap=Math.max(0,Math.min(pct-1,1));
    const [a,b]=RING_SETS[r.k]; 
    const prev=ringMem[r.k]!=null?ringMem[r.k]:0; ringMem[r.k]=shown;
    body+=`<circle cx="${cx}" cy="${cx}" r="${rad.toFixed(1)}" fill="none" stroke="${a}" stroke-opacity=".2" stroke-width="${sw}"/>`;
    if(shown>0.004) body+=`<circle class="ar" cx="${cx}" cy="${cx}" r="${rad.toFixed(1)}" fill="none" stroke="${a}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-prev)).toFixed(2)}" data-to="${(C*(1-shown)).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>`;
    if(lap>0.004) body+=`<circle class="ar lap" cx="${cx}" cy="${cx}" r="${rad.toFixed(1)}" fill="none" stroke="${a}" stroke-opacity=".55" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" data-to="${(C*(1-lap)).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>`;
  });

/* Run once per render: rings sweep from their last value; anything drawn at its old value (data-mt) moves to its new one.

function playMotion(root,base){
